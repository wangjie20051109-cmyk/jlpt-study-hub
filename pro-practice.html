<style>
:root{--bg:#f7f9fc;--card:#fff;--ink:#1d2637;--mute:#677488;--line:#e3e9f0;--mint:#dcf6ee;--green:#158b70;--red:#b43c48;--redbg:#ffe9ec;--blue:#2a68cf}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans SC","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.65}
button,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #7fb5ee;outline-offset:3px}a{color:inherit}
.app{max-width:810px;margin:auto;min-height:100vh;padding:14px 15px calc(105px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0 15px}.back{font-size:14px;text-decoration:none;font-weight:700;color:var(--blue)}h1{margin:0;font-size:22px;letter-spacing:.02em}.sub{font-size:12px;color:var(--mute)}.top .mark{border-radius:8px;padding:3px 7px;color:#fff;background:#e64c55;font-size:13px;font-weight:850}
.hero{background:linear-gradient(118deg,#232f45,#3f5c82);color:#fff;border-radius:22px;padding:17px 19px;margin-bottom:16px;box-shadow:0 10px 28px #29486c24}
.hero h2{font-size:20px;margin:0 0 4px}.hero p{font-size:12px;margin:0;opacity:.85}.stats{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0 0}.stat{border-radius:12px;background:#ffffff1e;padding:7px 12px;min-width:90px;flex:1}.stat strong{display:block;font-size:20px}.stat span{font-size:11px;opacity:.8}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.field{font-size:12px;color:var(--mute);font-weight:700}.field select{display:block;width:100%;border:1px solid var(--line);background:var(--card);padding:11px;border-radius:13px;color:var(--ink);margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:17px;margin:12px 0;box-shadow:0 7px 25px #2e4a7010}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.meta{font-size:13px;font-weight:750;color:var(--mute)}.count{font-variant-numeric:tabular-nums;font-weight:700}.progress{height:7px;background:#eaf0f5;border-radius:99px;margin:13px 0 15px;overflow:hidden}.progress>div{height:100%;width:0;background:var(--green);transition:width .25s}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 9px;background:#edf5ff;color:#2762a4;font-size:12px;font-weight:750}.question{font-size:clamp(19px,4.8vw,25px);font-weight:700;line-height:2.1;margin:16px 1px 20px;word-break:break-word}.question ruby,.opt ruby,.detail ruby{ruby-position:over}rt{font-weight:400;font-size:.52em;color:#8a98a7;line-height:1.1}
.opt{width:100%;display:flex;text-align:left;align-items:center;gap:13px;background:#fff;color:var(--ink);border:2px solid #e9eef4;border-radius:16px;min-height:74px;padding:12px 14px;margin:9px 0;font-size:17px}.opt b{font-size:17px;width:24px;color:#8fa0b0;font-variant-numeric:tabular-nums}.opt.selected{border-color:#46bea1;background:#e8f8f3}.opt.correct{background:var(--mint);border-color:var(--green)}.opt.wrong{background:var(--redbg);border-color:#ef7a86}.opt:disabled{opacity:1;cursor:default}.opt.correct b{color:var(--green)}.opt.wrong b{color:var(--red)}
.actions{display:flex;gap:9px;margin-top:17px}.actions button,.toolbtn{border-radius:14px;padding:11px 15px;font-weight:750;border:1px solid var(--line);background:#fff;color:var(--ink)}.actions .primary{background:#178e73;color:#fff;border-color:#178e73;flex:1;min-height:48px}.actions .secondary{flex:0 0 auto}.actions .primary:hover{background:#13755f}.toolbtn{font-size:13px}
#feedback{margin-top:15px;display:none}.judge{font-size:17px;font-weight:850}.judge.yes{color:var(--green)}.judge.no{color:var(--red)}
.explain{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.explain h3{font-size:16px;margin:14px 0 8px}.explain p{margin:8px 0}.detail{font-size:14px}.detail .example{background:#f5f8fc;padding:11px 13px;border-radius:13px;margin:9px 0}.reason{padding:10px 12px;margin:8px 0;border:1px solid var(--line);border-radius:12px}.reason.good{background:#edf9f4;border-color:#b4e5d0}.reason.bad{background:#fff7f7}.reason b{display:block;font-size:14px}.reason p{font-size:13px;color:var(--mute);margin:3px 0 0}.muted{color:var(--mute);font-size:13px}.note{color:#586777;font-size:12px;padding:8px 0}.footbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{text-align:center;padding:42px 12px}.empty .emoji{font-size:39px}.hidden{display:none!important}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px max(15px,env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom))}.bottomin{max-width:780px;margin:auto;display:flex;justify-content:space-between;gap:8px}.bottom button{padding:10px 8px;border:0;background:transparent;font-weight:750;color:#526078;flex:1;border-radius:10px}.bottom button.active{background:#e9f6f1;color:#16866c}
@media(min-width:640px){.app{padding-top:24px}.card{padding:25px 29px}.opt{min-height:82px}}
@media(max-width:360px){.question{font-size:18px}.opt{font-size:15px;padding:10px}.hero{padding:14px}.stats{gap:5px}.stat{min-width:80px}.bottom button{font-size:12px}}

(function(){
'use strict';
var Q=[
{id:"n2-budget",l:"N2",topic:"条件与依据",p:"この店(みせ)では、お客(きゃく)さんの予算(よさん)＿＿＿料理(りょうり)を用意(ようい)します。",full:"この店(みせ)では、お客(きゃく)さんの予算(よさん)に応(おう)じて料理(りょうり)を用意(ようい)します。",zh:"这家店会根据客人的预算准备菜肴。",a:2,opts:[["に比(くら)べて","与……相比","用于比较两个对象，而这里需要依据预算安排菜肴。"],["に先立(さきだ)って","在……之前","表示事前的时间顺序，不是依照预算。"],["に応(おう)じて","根据……、按照……","表示按预算这一条件来调整料理，符合句意。"],["に向(む)けて","朝着……、为了……","侧重目标方向，并非按照预算作出调整。"]],conn:"名词＋に応(おう)じて",usage:"表示根据情况、条件或需求进行相应调整。",ex:"状況(じょうきょう)に応(おう)じて予定(よてい)を変(か)えます。",exzh:"根据情况更改计划。",diff:"に応(おう)じて＝按照条件；に向(む)けて＝朝着目标。"},
{id:"n2-before",l:"N2",topic:"时间与准备",p:"開会式(かいかいしき)＿＿＿、参加者(さんかしゃ)に注意事項(ちゅういじこう)を説明(せつめい)した。",full:"開会式(かいかいしき)に先立(さきだ)って、参加者(さんかしゃ)に注意事項(ちゅういじこう)を説明(せつめい)した。",zh:"开幕式开始前，向参加者说明了注意事项。",a:1,opts:[["を通(つう)じて","通过……；贯穿……","表示媒介或整个期间，而不是在仪式前。"],["に先立(さきだ)って","在……之前","用于重要事件开始前的准备或说明，正确。"],["に沿(そ)って","沿着……；按照……","表示遵循路线或方针，不表示事前时间。"],["に反(はん)して","与……相反","表示违反或对立，语义不符。"]],conn:"名词＋に先立(さきだ)って",usage:"较正式，表示在重大活动或行动之前先做准备。",ex:"出発(しゅっぱつ)に先立(さきだ)って安全(あんぜん)を確認(かくにん)します。",exzh:"出发之前先确认安全。",diff:"に先立(さきだ)って常带正式事前准备意味；前(まえ)に更日常。"},
{id:"n2-regardless",l:"N2",topic:"无论条件",p:"天候(てんこう)＿＿＿、明日(あした)のイベントは予定(よてい)どおり行(おこな)います。",full:"天候(てんこう)にかかわらず、明日(あした)のイベントは予定(よてい)どおり行(おこな)います。",zh:"无论天气如何，明天的活动都按计划举行。",a:0,opts:[["にかかわらず","不论……；不受……影响","强调不受天气这一条件影响，正确。"],["に従(したが)って","随着……；遵照……","表示随变化而变化，和“不论天气”相反。"],["に比(くら)べて","与……相比","需要比较对象，这里不是比较。"],["の末(すえ)に","经过……之后终于……","侧重经过长期过程后得到的结果。"]],conn:"名词＋にかかわらず",usage:"不受某个条件或区别的限制。",ex:"年齢(ねんれい)にかかわらず応募(おうぼ)できます。",exzh:"不论年龄都可以报名。",diff:"にかかわらず＝无论条件；に応(おう)じて＝随条件而调整。"},
{id:"n2-despite",l:"N2",topic:"逆接·转折",p:"彼(かれ)は熱(ねつ)がある＿＿＿、仕事(しごと)に行(い)った。",full:"彼(かれ)は熱(ねつ)があるにもかかわらず、仕事(しごと)に行(い)った。",zh:"他明明发烧了，却仍然去上班。",a:1,opts:[["ことから","由于……；从……来看","表示原因或推断，不是出乎意料的转折。"],["にもかかわらず","尽管……却……","发烧与去上班形成强烈逆接，正确。"],["に限(かぎ)って","偏偏……；唯独……","用于特定时间或对象，不接在这里的普通形后表达转折。"],["だけあって","不愧是……；正因为……","强调符合预期的评价，与这里相反。"]],conn:"普通形＋にもかかわらず；名词／な形容词＋であるにもかかわらず",usage:"表示实际结果和一般预期相反，比较正式。",ex:"雨(あめ)が降(ふ)っているにもかかわらず、人(ひと)が集(あつ)まりました。",exzh:"尽管下雨了，人们还是聚集过来。",diff:"のに也表示逆接，但にもかかわらず书面性更强。"},
{id:"n2-notnecessarily",l:"N2",topic:"部分否定",p:"高(たか)い商品(しょうひん)が必(かなら)ずしも品質(ひんしつ)がいい＿＿＿。",full:"高(たか)い商品(しょうひん)が必(かなら)ずしも品質(ひんしつ)がいいわけではない。",zh:"贵的商品并不一定质量就好。",a:3,opts:[["に違(ちが)いない","一定是……","表示很有把握的推断，和“不一定”冲突。"],["はずがない","不可能……","完全否定，强于题目所需的部分否定。"],["に決(き)まっている","肯定……","表示主观确信，不符合必ずしも。"],["わけではない","并非一定……","与必ずしも呼应，表示部分否定，正确。"]],conn:"普通形＋わけではない；な形容词＋なわけではない；名词＋というわけではない",usage:"否定绝对化的判断，常与必ずしも、全部(ぜんぶ)、いつも连用。",ex:"日本語(にほんご)を話(はな)せるからといって、漢字(かんじ)が全部(ぜんぶ)読(よ)めるわけではありません。",exzh:"会说日语并不代表所有汉字都认识。",diff:"わけがない＝绝不可能；わけではない＝并不一定。"},
{id:"n2-addition",l:"N2",topic:"并列递进",p:"この部屋(へや)は広(ひろ)い＿＿＿、駅(えき)からも近(ちか)い。",full:"この部屋(へや)は広(ひろ)いうえに、駅(えき)からも近(ちか)い。",zh:"这个房间不仅宽敞，而且离车站也近。",a:0,opts:[["うえに","而且……；再加上……","两个优点叠加，正确。"],["一方(いっぽう)で","另一方面……","常用于对比不同方面，非简单优势累加。"],["ばかりに","只因为……导致……","多接不好的结果，不符合赞美叠加。"],["末(すえ)に","经过……最终……","强调一段过程的结果，而不是添加事实。"]],conn:"普通形＋うえに；名词＋のうえに；な形容词＋なうえに",usage:"在已有性质或情况基础上，再加上另一个性质或情况。",ex:"この店(みせ)は安(やす)いうえに、接客(せっきゃく)も丁寧(ていねい)です。",exzh:"这家店不仅便宜，服务也很周到。",diff:"うえに可以累加优点也可以累加缺点；だけでなく偏重“不仅……还……”。"},
{id:"n2-progress",l:"N2",topic:"变化趋势",p:"日本(にほん)では電子(でんし)決済(けっさい)がさらに普及(ふきゅう)し＿＿＿。",full:"日本(にほん)では電子(でんし)決済(けっさい)がさらに普及(ふきゅう)しつつある。",zh:"在日本，电子支付正在进一步普及。",a:2,opts:[["がちだ","容易……；经常……","表示不太理想的倾向，不能自然描述正在普及。"],["かねない","有可能造成……","常用于担忧的不良可能性，语义不符。"],["つつある","正在逐渐……","接动词ます形去ます，表示变化正在持续，正确。"],["っぱなしだ","一直保持某种放任状态","表达状态持续，不能表示逐渐普及。"]],conn:"动词ます形去ます＋つつある",usage:"书面表达，表示某变化正处于推进过程。",ex:"町(まち)の人口(じんこう)は少(すこ)しずつ減(へ)りつつあります。",exzh:"镇上的人口正在逐渐减少。",diff:"～ている偏重进行或状态；つつある偏重变化的趋势。"},
{id:"n2-certain",l:"N2",topic:"有把握的推测",p:"電気(でんき)が消(き)えているし、誰(だれ)も返事(へんじ)をしない。もう帰(かえ)った＿＿＿。",full:"電気(でんき)が消(き)えているし、誰(だれ)も返事(へんじ)をしない。もう帰(かえ)ったに違(ちが)いない。",zh:"灯关着，也没人回应，肯定已经回去了。",a:3,opts:[["わけではない","并非……","是否定判断，和说话人的推断不符。"],["ことはない","没有必要……；不会……","不能自然表达这里的确信推测。"],["とは限(かぎ)らない","未必……","表示不确定，与强烈推测相反。"],["に違(ちが)いない","一定……；肯定……","根据现场线索推断，正确。"]],conn:"普通形＋に違(ちが)いない；名词／な形容词＋に違(ちが)いない",usage:"说话人根据证据做出较有把握的推测。",ex:"こんなに練習(れんしゅう)したのだから、彼(かれ)は合格(ごうかく)するに違(ちが)いない。",exzh:"练习了这么多，他一定能合格。",diff:"に違(ちが)いない是推断；に決(き)まっている更偏强烈的主观断定。"},
{id:"n2-proceed",l:"N2",topic:"做完前项后",p:"十分(じゅうぶん)に考(かんが)えた＿＿＿、進路(しんろ)を決(き)めたい。",full:"十分(じゅうぶん)に考(かんが)えたうえで、進路(しんろ)を決(き)めたい。",zh:"我想充分考虑之后再决定未来道路。",a:1,opts:[["わりに","虽然……但是……（与预期不符）","表示出乎意料的评价，不是行动顺序。"],["うえで","在……之后，再……","强调前项完成后进行后项决定，正确。"],["だけに","正因为……所以……","表示理由的程度，不是先后顺序。"],["とともに","与……同时；随着……","偏同时变化，这里强调考虑完再决定。"]],conn:"动词た形＋うえで",usage:"先完成前项准备、调查或思考，再进行下一步。",ex:"説明(せつめい)を聞(き)いたうえで、申(もう)し込(こ)みます。",exzh:"听完说明后再报名。",diff:"动词た形＋うえで＝做完A再B；动词辞书形＋うえで＝为了做B而需要的条件。"},
{id:"n2-aslongas",l:"N2",topic:"既然做了就……",p:"約束(やくそく)した＿＿＿、最後(さいご)まで責任(せきにん)を持(も)つべきだ。",full:"約束(やくそく)した以上(いじょう)は、最後(さいご)まで責任(せきにん)を持(も)つべきだ。",zh:"既然已经答应，就应该负责到底。",a:0,opts:[["以上(いじょう)は","既然……就……","表示根据已确定的事实推导责任或义务，正确。"],["うちに","趁着……；在……过程中","时间内完成行为，不能表达义务。"],["たびに","每当……就……","表示反复发生，非一次承诺。"],["ところで","即使……也……（未必有用）","常用于动词た形后表示让步，这里不自然。"]],conn:"动词普通形＋以上(いじょう)は",usage:"既然某事实已成立，就应该采取相应行动。",ex:"引(ひ)き受(う)けた以上(いじょう)は、最後(さいご)までやります。",exzh:"既然接下来了，就做到底。",diff:"以上(いじょう)は比から更强调责任、决心或必然结果。"},
{id:"n3-habit",l:"N3",topic:"保持习惯",p:"健康(けんこう)のために、毎朝(まいあさ)野菜(やさい)を食(た)べる＿＿＿。",full:"健康(けんこう)のために、毎朝(まいあさ)野菜(やさい)を食(た)べるようにしています。",zh:"为了健康，我努力保持每天早上吃蔬菜的习惯。",a:1,opts:[["ことになりました","（由外部安排）决定了……","表示规定或决定，不强调自身持续的习惯。"],["ようにしています","尽量做到……；保持……习惯","强调个人努力养成习惯，正确。"],["しかありません","只能……","表示没有其他选择，与健康习惯不符。"],["わけがありません","不可能……","用于否定可能性，语义不符。"]],conn:"动词辞书形／ない形＋ようにしている",usage:"有意识地坚持做或避免做某事。",ex:"寝(ね)る前(まえ)にスマホを見(み)ないようにしています。",exzh:"我尽量坚持睡前不看手机。",diff:"ようにする强调开始努力；ようにしている强调持续习惯。"},
{id:"n3-just",l:"N3",topic:"刚刚完成",p:"日本(にほん)に来(き)た＿＿＿なので、まだ道(みち)がよく分(わ)かりません。",full:"日本(にほん)に来(き)たばかりなので、まだ道(みち)がよく分(わ)かりません。",zh:"因为刚来日本，还不太认路。",a:0,opts:[["ばかり","刚刚……","表示主观感觉事情发生不久，正确。"],["ところ","刚刚……（正处于动作时间点）","たところ也有刚完成之意，但与“刚来不久”的持续生活背景搭配，ばかり更自然。"],["つもり","打算……","表示计划，与已来日本矛盾。"],["はず","应该……","表示推断，与刚来日本的时间关系不符。"]],conn:"动词た形＋ばかり",usage:"说话人主观认为某事刚发生，即使已过去一段时间也能使用。",ex:"大学(だいがく)を卒業(そつぎょう)したばかりです。",exzh:"我刚大学毕业。",diff:"たところ＝刚完成动作的当下；たばかり＝主观觉得刚发生不久。"},
{id:"n3-afterdoing",l:"N3",topic:"做了才发现",p:"先生(せんせい)に相談(そうだん)した＿＿＿、別(べつ)の方法(ほうほう)を教(おし)えてくれた。",full:"先生(せんせい)に相談(そうだん)したところ、別(べつ)の方法(ほうほう)を教(おし)えてくれた。",zh:"找老师商量之后，老师告诉了我另一种方法。",a:2,opts:[["ばかり","刚刚……","只表示事情发生不久，不自然连接商量后的结果。"],["はずで","理应……","表示预期，不能表达后项实际结果。"],["ところ","……之后，结果……","表示实施前项后出现的发现或结果，正确。"],["まま","保持……状态","表示状态持续，不是咨询后的结果。"]],conn:"动词た形＋ところ",usage:"做了某事之后得到了新的发现或结果。",ex:"調(しら)べたところ、予約(よやく)が必要(ひつよう)だと分(わ)かりました。",exzh:"查了一下才知道需要预约。",diff:"たところ＝做后发现结果；たばかり＝刚发生。"},
{id:"n3-thanks",l:"N3",topic:"正面原因",p:"友達(ともだち)が手伝(てつだ)ってくれた＿＿＿、早(はや)く終(お)わりました。",full:"友達(ともだち)が手伝(てつだ)ってくれたおかげで、早(はや)く終(お)わりました。",zh:"多亏朋友帮忙，我才这么快完成。",a:3,opts:[["せいで","都怪……；因为……","一般表示负面原因，而这里结果是正面的。"],["かわりに","代替……；作为交换","表示替代或交换，不是感谢原因。"],["あいだに","在……期间","表示动作发生的时间范围，非原因。"],["おかげで","多亏……；托……的福","导致好结果且带感谢意味，正确。"]],conn:"普通形＋おかげで；名词＋のおかげで",usage:"多用来表达积极结果的原因，并含感谢之意。",ex:"先生(せんせい)のおかげで合格(ごうかく)できました。",exzh:"多亏老师，我才考过了。",diff:"おかげで＝多亏（正面）；せいで＝都怪（负面）。"},
{id:"n3-decided",l:"N3",topic:"外部决定",p:"来月(らいげつ)から、新(あたら)しいクラスで勉強(べんきょう)する＿＿＿。",full:"来月(らいげつ)から、新(あたら)しいクラスで勉強(べんきょう)することになりました。",zh:"安排决定从下个月起在新的班级学习。",a:1,opts:[["ことにしました","（我自己）决定了……","强调说话人自主决定；这里预设为学校安排。"],["ことになりました","（客观安排）决定了……","表示校方或外部安排决定的结果，正确。"],["ようにしました","努力做到……","表示个人调整行为，不表示分班安排。"],["たことがあります","曾经做过……","表示经历，而非将来的安排。"]],conn:"动词辞书形／ない形＋ことになる",usage:"说明外部安排、规则或某种结果使事情被决定。",ex:"来週(らいしゅう)から大阪(おおさか)へ出張(しゅっちょう)することになりました。",exzh:"公司安排我下周去大阪出差。",diff:"ことにする＝自己决定；ことになる＝外部或客观决定。"},
{id:"n3-each",l:"N3",topic:"数量分配",p:"このプリントを一人(ひとり)に二枚(にまい)＿＿＿配(くば)ってください。",full:"このプリントを一人(ひとり)に二枚(にまい)ずつ配(くば)ってください。",zh:"请给每个人发两张这份讲义。",a:0,opts:[["ずつ","每……；各……","表示同等数量分配，每人两张，正确。"],["ごろ","大约……（时间点）","不能表示每人固定发放数量。"],["ほど","大约……；程度……","可表示大致数量，但不表达逐人等量分配。"],["ばかり","大约……；净是……","这里不如ずつ明确表达按人分配。"]],conn:"数量词＋ずつ",usage:"表示按相同数量分配或按一定步幅持续变化。",ex:"毎日(まいにち)少(すこ)しずつ日本語(にほんご)を覚(おぼ)えます。",exzh:"每天一点一点地学日语。",diff:"二枚(にまい)ずつ＝每次/每人两张；二枚(にまい)ほど＝大约两张。"}
];
var KEY='jlpt_pro_practice_v1',S={done:{},wrong:{},saved:[]};
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'{}');if(x&&typeof x==='object')S={done:x.done||{},wrong:x.wrong||{},saved:Array.isArray(x.saved)?x.saved:[]}}catch(e){}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('无法保存学习记录，请检查浏览器隐私存储设置。')}}
function fmt(v){var s=String(v||'');return s.replace(/([\u3400-\u9fff々ヶ]+)\(([ぁ-ゟー]+)\)/g,function(_,k,f){return '<ruby>'+k+'<rt>'+f+'</rt></ruby>'}).replace(/＿＿＿/g,'<span style="color:#178e73">＿＿＿</span>')}
function textOnly(s){return String(s||'').replace(/\([ぁ-ゟー]+\)/g,'')}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var current=null,selected=-1,answered=false,level=document.getElementById('level'),mode=document.getElementById('mode');
var byid=function(id){return document.getElementById(id)};
function pool(){return Q.filter(function(q){if(q.l!==level.value)return false;if(mode.value==='new')return !S.done[q.id];if(mode.value==='wrong')return !!S.wrong[q.id];if(mode.value==='saved')return S.saved.indexOf(q.id)>=0;return true})}
function stats(){var done=Object.values(S.done),first=done.filter(function(v){return v.firstCorrect}).length;byid('statDone').textContent=done.length;byid('statAcc').textContent=done.length?Math.round(first/done.length*100)+'%':'—';byid('statWrong').textContent=Object.keys(S.wrong).length}
function showEmpty(){current=null;byid('topic').textContent='本组已完成';byid('counter').textContent='0/0';byid('bar').style.width='100%';byid('question').innerHTML='<div class="empty"><div class="emoji">🎉</div><b>这里暂时没有待做的题目</b><p class="muted">可以切换等级，或选择「错题重练」「全部题目」继续练习。</p></div>';byid('options').innerHTML='';byid('feedback').style.display='none';byid('star').disabled=true;byid('submit').classList.add('hidden');byid('next').classList.add('hidden')}
function render(q){if(!q)return showEmpty();current=q;selected=-1;answered=false;var list=Q.filter(function(x){return x.l===level.value});var done=list.filter(function(x){return !!S.done[x.id]}).length;var p=pool();byid('topic').textContent=q.l+' · '+q.topic;byid('counter').textContent=mode.value==='new'?(done+1)+'/'+list.length:'1/'+p.length;byid('bar').style.width=Math.round(done/list.length*100)+'%';byid('question').innerHTML=fmt(q.p);byid('options').innerHTML=q.opts.map(function(o,i){return '<button type="button" class="opt" data-i="'+i+'"><b>'+(i+1)+'</b><span>'+fmt(o[0])+'</span></button>'}).join('');byid('options').querySelectorAll('button').forEach(function(b){b.onclick=function(){if(answered)return;selected=+b.dataset.i;byid('options').querySelectorAll('button').forEach(function(el){el.classList.toggle('selected',el===b)})}});byid('feedback').style.display='none';byid('feedback').innerHTML='';byid('star').disabled=false;byid('star').textContent=S.saved.indexOf(q.id)>=0?'★ 已收藏':'☆ 收藏';byid('submit').classList.remove('hidden');byid('next').classList.add('hidden');byid('submit').disabled=false}
function next(){render(pool()[0])}
function nav(value){mode.value=value;byid('navNew').classList.toggle('active',value==='new');byid('navWrong').classList.toggle('active',value==='wrong');byid('navSaved').classList.toggle('active',value==='saved');byid('navAll').classList.toggle('active',value==='all');next()}
function submit(){if(!current)return;if(selected<0){alert('请先选择一个答案。');return}if(answered)return;var q=current;answered=true;var yes=selected===q.a;var old=S.done[q.id];if(!old){S.done[q.id]={firstCorrect:yes,firstChoice:selected,answeredAt:Date.now()}}else{old.reviewedAt=Date.now();old.reviewCount=(old.reviewCount||0)+1}
if(yes){delete S.wrong[q.id]}else{S.wrong[q.id]={selected:selected,at:Date.now()}}persist();stats();byid('options').querySelectorAll('button').forEach(function(b){var i=+b.dataset.i;b.disabled=true;b.classList.remove('selected');if(i===q.a)b.classList.add('correct');if(i===selected&&!yes)b.classList.add('wrong')});
var feedback=byid('feedback');feedback.style.display='block';feedback.innerHTML='<div class="judge '+(yes?'yes':'no')+'">'+(yes?'✓ 回答正确！':'✕ 这道题再巩固一下')+'</div><div class="explain detail"><p><b>正确答案：'+(q.a+1)+' · '+fmt(q.opts[q.a][0])+'</b></p><p>'+esc(q.zh)+'</p><h3>完整日语原句</h3><div class="example">'+fmt(q.full)+'</div><h3>语法详解</h3><p><b>接续：</b>'+fmt(q.conn)+'</p><p><b>用法：</b>'+esc(q.usage)+'</p><h3>四个选项逐项分析</h3>'+q.opts.map(function(o,i){return '<div class="reason '+(i===q.a?'good':i===selected?'bad':'')+'"><b>'+(i+1)+'. '+fmt(o[0])+' · '+esc(o[1])+(i===q.a?' ✓':'')+'</b><p>'+esc(o[2])+'</p></div>'}).join('')+'<h3>例句与中文</h3><div class="example">'+fmt(q.ex)+'<div class="muted">'+esc(q.exzh)+'</div></div><h3>易混淆点</h3><p>'+fmt(q.diff)+'</p></div>';byid('submit').classList.add('hidden');byid('next').classList.remove('hidden');feedback.scrollIntoView({behavior:'smooth',block:'nearest'})}
function download(){var ids=Object.keys(S.wrong),items=ids.map(function(id){return Q.find(function(q){return q.id===id})}).filter(Boolean);if(!items.length){alert('暂时没有错题。做错的题会自动收进来。');return}var lines=['# JLPT Study Hub · 错题笔记','', '生成时间：'+new Date().toLocaleString('zh-CN'),''];items.forEach(function(q,idx){lines.push('## '+(idx+1)+'. '+q.l+' · '+q.topic,'',textOnly(q.full),'','中文：'+q.zh,'','接续：'+textOnly(q.conn),'用法：'+q.usage,'');q.opts.forEach(function(o,i){lines.push((i+1)+'. '+textOnly(o[0])+'｜'+o[1]+'｜'+o[2]+(i===q.a?' ✓':'') )});lines.push('','例句：'+textOnly(q.ex),'中文：'+q.exzh,'易混：'+textOnly(q.diff),'','---','')});var a=document.createElement('a'),url=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/markdown;charset=utf-8'}));a.href=url;a.download='JLPT_N2_N3_错题本.md';a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
function read(){if(!current){alert('当前没有题目');return}if(!('speechSynthesis'in window)){alert('当前浏览器不支持语音朗读。');return}speechSynthesis.cancel();var utterance=new SpeechSynthesisUtterance(textOnly(current.ex));utterance.lang='ja-JP';utterance.rate=.87;speechSynthesis.speak(utterance)}
byid('submit').onclick=submit;byid('next').onclick=next;byid('star').onclick=function(){if(!current)return;var i=S.saved.indexOf(current.id);if(i>=0)S.saved.splice(i,1);else S.saved.push(current.id);persist();byid('star').textContent=i>=0?'☆ 收藏':'★ 已收藏'};
byid('export').onclick=download;byid('read').onclick=read;byid('navNew').onclick=function(){nav('new')};byid('navWrong').onclick=function(){nav('wrong')};byid('navSaved').onclick=function(){nav('saved')};byid('navAll').onclick=function(){nav('all')};mode.onchange=function(){nav(mode.value)};level.onchange=function(){next()};
byid('reset').onclick=function(){var n=Object.keys(S.done).length;var ok=confirm('本模块已记录 '+n+' 道题。\n确定要清空【本模块】的已做、错题、收藏记录吗？\n旧学习站其他模块的记录不会被删除。');if(!ok)return;S={done:{},wrong:{},saved:[]};persist();stats();nav('new')};
load();stats();nav('new');
})();
</script>
