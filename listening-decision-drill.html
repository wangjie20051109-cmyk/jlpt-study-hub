<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N2听力行动判断专项｜JLPT Study Hub</title><style>body{font:16px/1.75 system-ui,sans-serif;background:#f5f7fb;color:#182337;margin:0;padding:20px}main{max-width:760px;margin:auto}article{background:white;padding:20px;border-radius:16px;margin:16px 0;box-shadow:0 2px 12px #15223b12}button{font:inherit;border:1px solid #64748b;background:white;border-radius:9px;padding:9px 12px;margin:5px;cursor:pointer}button:focus-visible{outline:3px solid #2563eb}ruby rt{font-size:.65em}details{margin-top:12px}p{margin:8px 0}.good{color:#166534}.bad{color:#b91c1c}</style></head><body><main><a href="./">← 返回首页</a><h1>N2听力｜下一步行动判断</h1><p>原创专项 · 5题 · 先读情境，尝试不看中文理解，再选出接下来要做的事。每题可查看注音、中文与排除理由。本页不修改原站学习记录。</p><div id="questions"></div></main><script>
const data=[
{jp:"女：案内（あんない）のメールはもう送（おく）りました。ポスターはまだです。男：じゃあ、まずポスターの案（あん）を作（つく）ってください。",zh:"女：通知邮件已经发了。海报还没有。男：那请先制作海报草案。",opts:["メールを送（おく）る｜发邮件","ポスターの案（あん）を作（つく）る｜制作海报草案","アンケートを配（くば）る｜发问卷","会場（かいじょう）を予約（よやく）する｜预约会场"],a:1,why:"「もう」表示已完成；「まだ」表示尚未完成；「まず」明确最先动作。"},
{jp:"男：資料（しりょう）は集（あつ）めました。女：では、内容（ないよう）を確認（かくにん）した上（うえ）で、先生（せんせい）に送（おく）ってください。",zh:"男：资料收集好了。女：那么确认内容之后，请发给老师。",opts:["資料（しりょう）を集（あつ）める｜收集资料","先生（せんせい）に電話（でんわ）する｜给老师打电话","内容（ないよう）を確認（かくにん）する｜确认内容","資料（しりょう）を捨（す）てる｜丢掉资料"],a:2,why:"「～た上で」表示前一步完成之后再做后一步；先确认，后发送。"},
{jp:"女：会場（かいじょう）は決（き）まった？男：うん。でも参加者（さんかしゃ）の人数（にんずう）がまだ分（わ）からない。女：人数（にんずう）が分（わ）かり次第（しだい）、椅子（いす）の数（かず）を調整（ちょうせい）しよう。",zh:"女：会场定了吗？男：定了，但还不知道参加人数。女：一知道人数，就调整椅子数量吧。",opts:["会場（かいじょう）を探（さが）す｜寻找会场","参加者（さんかしゃ）を断（ことわ）る｜拒绝参加者","椅子（いす）を捨（す）てる｜丢弃椅子","人数（にんずう）を確認（かくにん）する｜确认人数"],a:3,why:"会场已定；调整椅子需要先知道人数。「次第」提示后续动作的触发条件。"},
{jp:"男：発表（はっぴょう）の順番（じゅんばん）は決（き）めたよ。女：じゃあ、みんなに知（し）らせる前（まえ）に、先生（せんせい）に確認（かくにん）してもらおう。",zh:"男：发表顺序定好了。女：那在通知大家之前，先请老师确认吧。",opts:["先生（せんせい）に確認（かくにん）してもらう｜请老师确认","順番（じゅんばん）を決（き）める｜决定顺序","発表（はっぴょう）を中止（ちゅうし）する｜取消发表","全員（ぜんいん）にすぐ知（し）らせる｜立即通知所有人"],a:0,why:"顺序已定；「知らせる前に」说明通知之前还有确认步骤。"},
{jp:"女：予約（よやく）は取（と）れましたが、時間（じかん）が変更（へんこう）になりました。男：そうですか。では、参加者（さんかしゃ）に新（あたら）しい時間（じかん）を伝（つた）えてください。",zh:"女：已经订好了，但时间变更了。男：这样啊。那么请通知参加者新的时间。",opts:["予約（よやく）を取（と）る｜预订","時間（じかん）を元（もと）に戻（もど）す｜把时间改回去","参加者（さんかしゃ）に伝（つた）える｜通知参加者","参加者（さんかしゃ）を減（へ）らす｜减少参加者"],a:2,why:"「予約は取れました」已完成；「伝えてください」是明确指示。"}];
const host=document.getElementById("questions");data.forEach((q,i)=>{const e=document.createElement("article");const h=document.createElement("h2");h.textContent="第"+(i+1)+"题";e.append(h);const p=document.createElement("p");p.textContent=q.jp;e.append(p);const prompt=document.createElement("strong");prompt.textContent="接下来首先应该做什么？";e.append(prompt);const area=document.createElement("div"),result=document.createElement("p");result.setAttribute("role","status");q.opts.forEach((o,j)=>{const b=document.createElement("button");b.textContent=(j+1)+". "+o;b.onclick=()=>{result.className=j===q.a?"good":"bad";result.textContent=(j===q.a?"正确。":"再看关键句。正确答案："+(q.a+1)+"。")+q.why};area.append(b)});e.append(area,result);const d=document.createElement("details"),s=document.createElement("summary");s.textContent="展开中文翻译与解题提示";d.append(s);const z=document.createElement("p");z.textContent=q.zh+" "+q.why;d.append(z);e.append(d);host.append(e)});
</script></body></html>
