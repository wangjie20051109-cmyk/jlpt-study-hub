.study{min-height:290px}}</style></head><body><div class="w"><h1>📘 日本语精编词汇</h1><div class="sub">按教材课次复习｜日语・假名・中文・发音・已学记录</div><div class="top"><a class="pri" href="./">← 返回 JLPT 学习站</a><button id="random">🎯 本课随机</button><button id="reviewBtn">🧠 只看复习</button></div><div class="panel"><main class="card"><div class="row"><span class="tag" id="lessonTag">第1课</span><span class="tag" id="idx">0 / 0</span><span class="tag">扫描教材人工校对</span></div><div class="study"><div class="word" id="jp">正在加载…</div><div class="kana" id="kana"></div><div class="zh" id="zh"></div><div class="note"><b>记法</b><div class="tiny" id="hint" style="margin-top:6px">先看日语猜中文，再点发音。汉字保留原写法，假名单独显示。</div></div></div><div class="actions"><button id="prev">← 上一个</button><button id="speak">🔊 发音</button><button id="learn">☆ 已学</button><button id="addReview">＋ 加入复习</button><button class="pri" id="next">下一个 →</button></div></main><aside class="card"><b>教材课次</b><select id="lesson"></select><input id="search" type="search" placeholder="搜索：日语 / 假名 / 中文"><div class="tiny" style="margin-top:10px">原书共 48 课；当前已人工校对录入第 1–6 课。因为原 PDF 是扫描页，不用不可靠的自动识别硬塞错字。</div><div class="row" style="margin-top:12px"><span class="tag" id="learnedCount">已学 0</span><span class="tag" id="reviewCount">复习 0</span></div><div id="list" class="list"></div></aside></div><div class="foot">来源：《日本语精编词汇》扫描资料。这里只整理教材词汇用于个人学习；释义以原资料为准。</div></div><script>

const $=x=>document.getElementById(x),S=window.speechSynthesis;let lesson=1,i=0,reviewOnly=false;let learned=new Set(JSON.parse(localStorage.getItem('compactVocabLearned')||'[]'));let review=new Set(JSON.parse(localStorage.getItem('compactVocabReview')||'[]'));const key=x=>lesson+'|'+x[0];function sp(t){S.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.82;S.speak(u)}function rows(){let a=(DATA[lesson]||[]).filter(x=>{let q=$('search').value.trim().toLowerCase();return !q||(x.join(' ').toLowerCase().includes(q))});if(reviewOnly)a=a.filter(x=>review.has(key(x)));return a}function renderList(){let a=rows();$('list').innerHTML=a.map((x,n)=>`<div class="item" data-n="${n}"><b>${x[0]}</b><div class="tiny">${x[1]}｜${x[2]}</div></div>`).join('');[...$('list').querySelectorAll('.item')].forEach(el=>el.onclick=()=>{i=+el.dataset.n;render()})}function render(){let a=rows();$('lessonTag').textContent='第'+lesson+'课';$('learnedCount').textContent='已学 '+learned.size;$('reviewCount').textContent='复习 '+review.size;if(!a.length){$('jp').textContent='没有匹配结果';$('kana').textContent='';$('zh').textContent='';$('idx').textContent='0 / 0';renderList();return}i=(i+a.length)%a.length;let x=a[i],k=key(x);$('jp').textContent=x[0];$('kana').textContent='假名：'+x[1];$('zh').textContent='中文：'+x[2];$('idx').textContent=(i+1)+' / '+a.length;$('learn').textContent=learned.has(k)?'★ 已学':'☆ 已学';$('addReview').textContent=review.has(k)?'✓ 已在复习':'＋ 加入复习';renderList()}for(let n=1;n<=48;n++){let o=document.createElement('option');o.value=n;o.textContent='第'+n+'课'+(n<=6?'':'（待校对）');if(n>6)o.disabled=true;$('lesson').appendChild(o)}$('lesson').onchange=()=>{lesson=+$('lesson').value;i=0;reviewOnly=false;$('reviewBtn').textContent='🧠 只看复习';render()};$('search').oninput=()=>{i=0;render()};$('prev').onclick=()=>{i--;render()};$('next').onclick=()=>{i++;render()};$('speak').onclick=()=>{let a=rows();if(a.length)sp(a[(i+a.length)%a.length][0])};$('learn').onclick=()=>{let a=rows();if(!a.length)return;let k=key(a[(i+a.length)%a.length]);learned.has(k)?learned.delete(k):learned.add(k);localStorage.setItem('compactVocabLearned',JSON.stringify([...learned]));render()};$('addReview').onclick=()=>{let a=rows();if(!a.length)return;let k=key(a[(i+a.length)%a.length]);review.has(k)?review.delete(k):review.add(k);localStorage.setItem('compactVocabReview',JSON.stringify([...review]));render()};$('reviewBtn').onclick=()=>{reviewOnly=!reviewOnly;i=0;$('reviewBtn').textContent=reviewOnly?'📚 看本课全部':'🧠 只看复习';render()};$('random').onclick=()=>{let a=rows();if(a.length){i=Math.floor(Math.random()*a.length);render()}};render();
