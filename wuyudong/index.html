<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>吴玉东大傻逼研究所</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#2b174e 0,#110d20 45%,#08070d 100%);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}.wrap{width:min(920px,100%)}.hero{background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.16);border-radius:28px;padding:34px;box-shadow:0 25px 80px rgba(0,0,0,.45);backdrop-filter:blur(14px)}.badge{display:inline-block;padding:8px 13px;border-radius:999px;background:#ffdf6b;color:#241300;font-weight:800;font-size:14px}.title{font-size:clamp(38px,8vw,78px);line-height:1.02;margin:18px 0 8px;font-weight:950;letter-spacing:-2px}.title span{color:#ff5f88;text-shadow:0 0 30px rgba(255,95,136,.35)}.sub{font-size:18px;opacity:.78;max-width:650px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.card{padding:18px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}.num{font-size:30px;font-weight:900}.lab{opacity:.7;font-size:14px;margin-top:4px}.panel{margin-top:16px;padding:20px;border-radius:22px;background:#0d0a16;border:1px solid rgba(255,255,255,.12)}.meter{height:14px;border-radius:999px;background:#252031;overflow:hidden;margin:12px 0 8px}.meter i{display:block;height:100%;width:3%;background:linear-gradient(90deg,#ff5f88,#ffcf5a);border-radius:999px;transition:width .35s}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:15px;padding:13px 18px;font-size:16px;font-weight:800;cursor:pointer}.pri{background:#ff5f88;color:#fff}.sec{background:#fff;color:#17141f}.quote{font-size:20px;font-weight:800;line-height:1.6;min-height:64px}.tiny{font-size:13px;opacity:.55;margin-top:18px}.emoji{position:fixed;pointer-events:none;font-size:28px;animation:fly 1.4s ease-out forwards}@keyframes fly{to{transform:translateY(-180px) rotate(30deg);opacity:0}}@media(max-width:650px){.hero{padding:24px}.grid{grid-template-columns:1fr}.title{letter-spacing:-1px}.buttons button{flex:1}}</style></head><body><main class="wrap"><section class="hero"><span class="badge">🧪 虚构人物观察项目</span><h1 class="title">吴玉东<br><span>大傻逼研究所</span></h1><p class="sub">本网站专门研究一个虚构角色：为什么他每次都能精准避开正确答案，并且还显得非常自信。</p><div class="grid"><div class="card"><div class="num" id="iq">3%</div><div class="lab">智商加载进度</div></div><div class="card"><div class="num" id="ops">999+</div><div class="lab">离谱操作次数</div></div><div class="card"><div class="num">S+</div><div class="lab">嘴硬等级</div></div></div><div class="panel"><b>🧠 智商加载器</b><div class="meter"><i id="bar"></i></div><div id="msg">系统正在尝试连接吴玉东的大脑……</div><div class="buttons"><button class="pri" onclick="boost(event)">再抢救一下</button><button class="sec" onclick="quote()">生成今日评价</button></div></div><div class="panel"><div class="quote" id="quote">“他不是没有想法，只是每个想法都成功绕开了重点。”</div></div><div class="tiny">※ 纯属虚构恶搞页面，不对应现实人物。© 大聪明研究中心</div></section></main><script>const qs=['“吴玉东最大的优点：每次犯傻都很有新意。”','“别人是三思而后行，他是三秒之后直接开干。”','“当所有人都以为不会更离谱时，他站了出来。”','“他的自信和正确率，长期保持着稳定的反向关系。”','“系统检测结果：不是没救，是服务器拒绝连接。”','“聪明是一种天赋，吴玉东选择了不使用。”'];function quote(){document.getElementById('quote').textContent=qs[Math.floor(Math.random()*qs.length)]}function boost(e){const bar=document.getElementById('bar'),iq=document.getElementById('iq'),msg=document.getElementById('msg');let n=Math.floor(Math.random()*14)+1;bar.style.width=n+'%';iq.textContent=n+'%';msg.textContent=n>10?'奇迹！短暂检测到脑细胞活动。':'加载失败：脑回路正在维护中。';for(let i=0;i<10;i++){const s=document.createElement('span');s.className='emoji';s.textContent=['🤡','🧠','❓','💥','😂'][Math.floor(Math.random()*5)];s.style.left=(e.clientX+Math.random()*120-60)+'px';s.style.top=(e.clientY+Math.random()*40-20)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),1500)}}quote();</script></body></html>
