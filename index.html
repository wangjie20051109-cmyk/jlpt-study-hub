<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JLPT 学习站</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#0b1020;color:#eef4ff;padding:24px;line-height:1.7}#load{max-width:680px;margin:12vh auto}</style></head><body><div id="load">正在加载 JLPT 学习站…</div><script>(async()=>{try{const names=['s0.txt','s1.txt','s2.txt','s3.txt','s4.txt'];const parts=await Promise.all(names.map(n=>fetch(n+'?v=20260827stable').then(r=>{if(!r.ok)throw new Error(n);return r.text()})));const b=parts.join('').trim(),bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('browser');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('load').innerHTML='<h2>页面加载失败</h2><p>请刷新页面或使用最新版 Chrome、Edge、Safari。</p>'}})();</script></body></html>
