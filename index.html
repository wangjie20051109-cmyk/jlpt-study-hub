<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JLPT 学习站</title><style>body{font-family:system-ui,-apple-system,sans-serif;padding:24px;line-height:1.7}#load{max-width:680px;margin:12vh auto}</style></head><body><div id="load">正在加载 JLPT 学习站…</div><script>(async()=>{try{const names=['p0.txt','p1.txt','p2.txt','p3.txt','p4.txt'];const parts=await Promise.all(names.map(n=>fetch(n+'?v=1').then(r=>{if(!r.ok)throw new Error(n);return r.text()})));const b=parts.join('').trim();const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('browser');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('load').innerHTML='<h2>页面加载失败</h2><p>请使用最新版 Chrome、Edge 或 Safari 打开。</p>'}})();</script></body></html>
