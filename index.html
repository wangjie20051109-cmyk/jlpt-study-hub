<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <title>JLPT Study Hub · N2 每日学习</title>
  <link rel="stylesheet" href="./site.css?v=study-loop1">
  <link rel="stylesheet" href="./study/study.css?v=1">
</head>
<body>
<main class="shell study-shell">
  <header class="topline study-header">
    <a class="brand" href="./" aria-label="JLPT Study Hub 首页">
      <span class="brandmark" aria-hidden="true">日</span>
      <span><strong>JLPT Study Hub</strong><small>N2 每日学习</small></span>
    </a>
    <button class="btn study-toggle" type="button" data-furigana-toggle aria-pressed="true">带平假名</button>
  </header>
  <div id="study-home">
    <section class="hero study-hero">
      <div>
        <p class="eyebrow" id="study-date">JLPT N2 · 日本时间</p>
        <h1>今天学什么？</h1>
        <p>每天学一点。错过的题，按时间回来再做。</p>
        <a class="btn primary" id="study-next" href="#learn-words">开始今日学习 <span aria-hidden="true">→</span></a>
      </div>
      <div class="study-hero-progress">
        <span>今日任务</span>
        <strong id="study-progress">0 / 5</strong>
        <progress id="study-bar" max="5" value="0" aria-label="今日任务完成数"></progress>
        <small id="study-streak">连续学习 0 天</small>
      </div>
    </section>
    <div class="section-title"><h2>今日任务</h2><a class="btn" href="#review">打开错题本</a></div>
    <section id="study-tasks" class="study-task-grid" aria-label="今日任务列表"></section>
    <div class="section-title"><h2>学习记录</h2><a class="btn" href="#favorites">查看收藏</a></div>
    <section id="study-stats" aria-label="学习统计"></section>
    <div class="section-title"><h2>四站入口</h2></div>
    <section class="menu-grid study-links">
      <a class="card study-link" href="./strategy.html"><span class="study-icon tone-purple">◎</span><span><strong>对策训练</strong><small>语法、阅读、听力专项</small></span><b aria-hidden="true">↗</b></a>
      <a class="card study-link" href="./words.html"><span class="study-icon tone-red">あ</span><span><strong>背单词</strong><small>词库、词条、例句与发音</small></span><b aria-hidden="true">↗</b></a>
      <a class="card study-link" href="./practice.html"><span class="study-icon tone-green">✓</span><span><strong>考试刷题</strong><small>N2 / N3 原有题库</small></span><b aria-hidden="true">↗</b></a>
      <a class="card study-link" href="./my.html"><span class="study-icon tone-gold">◇</span><span><strong>我的学习</strong><small>进度、收藏与数据备份</small></span><b aria-hidden="true">↗</b></a>
    </section>
    <section class="study-more" aria-label="原有学习内容">
      <a href="./grammar.html">语法练习库</a><a href="./listening.html">完整听力训练</a><a href="./listening-decision-drill.html">N2听力·下一步行动专项（新）</a><a href="./youth-notebook.html">今日喜欢上你了 · 口语摘抄本</a><a href="./classic.html">经典学习站</a>
    </section>
    <p class="notice">学习记录保存在当前浏览器。每日训练使用可重复练习的自编题与原站素材，非 JLPT 官方试题。</p>
  </div>
  <section id="study-view" aria-label="学习练习" hidden></section>
  <p class="study-message" id="study-error" role="status" hidden></p>
  <noscript>请启用 JavaScript 以加载每日任务。</noscript>
</main>
<script src="./study/shared.js?v=1"></script>
<script src="./site.js?v=study-loop1"></script>
<script type="module" src="./study/app.js?v=1"></script>
</body>
</html>
