const DATA=[{"id":"suwon1-meet","cat":"再会","type":"报道核实","jp":"会（あ）いたかった。","zh":"一直想见你。","detail":"会（あ）います／会（あ）う：见面。N4「～たい」过去形「～たかった」表示此前一直想见。","polite":"お会（あ）いしたかったです。","practice":"久（ひさ）しぶり！ずっと会（あ）いたかった。／好久不见！一直很想见你。","src":"https://times.abema.tv/articles/-/10281772","episode":"スウォン編 第1話（2026-10-19）"},{"id":"suwon1-shake","cat":"心动","type":"报道核实","jp":"手（て）、震（ふる）えてる。","zh":"手都在发抖。","detail":"震（ふる）えます／震（ふる）える：发抖。N3「～ている」→「～てる」，省略い。","polite":"手（て）が震（ふる）えています。","practice":"緊張（きんちょう）して、声（こえ）が震（ふる）えてる。／太紧张了，声音都在抖。","src":"https://times.abema.tv/articles/-/10281772","episode":"スウォン編 第1話（2026-10-19）"},{"id":"suwon1-kakkoii","cat":"第一印象","type":"报道核实","jp":"めっちゃかっこええやん。","zh":"也太帅了吧！","detail":"めっちゃ＝非常；かっこええ＝关西风格的「かっこいい」；「やん」近似口语「じゃん」。这是演播室评论。","polite":"とてもかっこいいですね。","practice":"この服（ふく）、めっちゃ似合（にあ）ってるじゃん。／这衣服也太适合你了吧。","src":"https://times.abema.tv/articles/-/10281771","episode":"スウォン編 第1話（2026-10-19）"},{"id":"original-kininaru","cat":"暧昧","type":"原创练习","jp":"ちょっと気（き）になってるんだけど。","zh":"我有点在意你来着……","detail":"気（き）になります／気（き）になる：在意。N3「～んだけど」用于委婉铺垫；「～ている」→「～てる」。不等于已经喜欢。","polite":"少（すこ）し気（き）になっているんですが。","practice":"最近（さいきん）、あの人（ひと）のことが気（き）になってる。／最近有点在意那个人。","src":"","episode":"原创，不是节目原话"},{"id":"suwon1-kawaii","cat":"第一印象","type":"报道核实","jp":"え、かわいい！","zh":"诶，好可爱！","detail":"え＝惊讶的语气词；かわいい【N5】＝可爱。演播室评价，省略了「ですね」等礼貌成分。","polite":"とてもかわいいですね。","practice":"え、その髪型（かみがた）、かわいい！／诶，你这个发型好可爱！","src":"https://times.abema.tv/articles/-/10281770","episode":"スウォン編 第1話（2026-10-19） · 10/23新增"},{"id":"suwon1-idol","cat":"第一印象","type":"报道核实","jp":"アイドルみたい。","zh":"像偶像一样。","detail":"アイドル：来自英语 idol（偶像），日语常指演艺偶像；名词＋みたい【N3】＝像……一样（口语）。演播室评价。","polite":"アイドルのようですね。","practice":"モデルみたいに背（せ）が高（たか）いね。／个子像模特一样高呢。（モデル来自英语 model，模特）","src":"https://times.abema.tv/articles/-/10281770","episode":"スウォン編 第1話（2026-10-19） · 10/23新增"},{"id":"original-invite","cat":"邀约","type":"原创练习","jp":"今度（こんど）、二人（ふたり）で話（はな）せたりする？","zh":"下次能不能我们两个人聊聊？","detail":"話（はな）します／話（はな）す→話（はな）せる（可能形）；～たりする【N3相关】在此柔和地询问可行性，非单纯并列。","polite":"今度（こんど）、少（すこ）しお話（はなし）しませんか。","practice":"今日（きょう）、少（すこ）しだけ話（はな）せる？／今天能稍微聊会儿吗？","src":"","episode":"2026-10-23原创 · 非节目原话"},{"id":"original-chattau","cat":"暧昧","type":"原创练习","jp":"誘（さそ）おうと思（おも）ってたんだけど、タイミング逃（のが）しちゃった。","zh":"本来想约你的，但错过时机了。","detail":"誘（さそ）います／誘（さそ）う：邀请；逃（のが）します／逃（のが）す：错过；～ようと思（おも）ってた【N3】原本打算；～ちゃった＝～てしまった【N3】；タイミング来自英语 timing（时机）。","polite":"お誘（さそ）いしようと思（おも）っていたのですが、機会（きかい）を逃（のが）してしまいました。","practice":"言（い）おうと思（おも）ってたのに、忘（わす）れちゃった。／本来想说的，却忘记了。","src":"","episode":"2026-10-23原创 · 非节目原话"},{"id":"takao4-eye","cat":"心动","type":"报道核实","jp":"目（め）、見（み）られねえ。","zh":"不敢看（对方的）眼睛。","detail":"見（み）ます／見（み）る：看；見（み）られる：能够看；「～ねえ」是「～ない」的粗犷口语变体，语气随人和地区而异。N3相关：可能形。报道标题核实短句，未逐字核验视频字幕。","polite":"緊張（きんちょう）して、目（め）を見（み）られません。","practice":"恥（は）ずかしくて、顔（かお）を見（み）られない。／太害羞了，不敢看脸。","src":"https://times.abema.tv/articles/-/10276918","episode":"タカオ編 第4話（2026-10-05放送／10-06报道） · 10/24新增"},{"id":"takao3-jealous","cat":"吃醋","type":"报道核实","jp":"イライラするくらいヤキモチ妬（や）いちゃって……","zh":"吃醋吃到有点烦躁……","detail":"妬（や）きます／妬（や）く：嫉妒；ヤキモチを妬（や）く：吃醋；「～ちゃって」＝「～てしまって」，常带情绪或遗憾；「～くらい」表示程度。イライラ是烦躁的拟态词。节目报道核实短句。","polite":"嫉妬（しっと）してしまうほど、気（き）になっていました。","practice":"ほかの人（ひと）と話（はな）していて、ちょっとヤキモチ妬（や）いちゃった。／看到你和别人聊天，我有点吃醋了。","src":"https://times.abema.tv/articles/-/10275469","episode":"タカオ編 第3話（2026-09-28放送／10-01报道） · 10/24新增"},{"id":"original-gachi-numa","cat":"心动","type":"原创练习","jp":"ガチで沼（ぬま）りそう。","zh":"感觉真的要彻底迷上了。","detail":"ガチで：真的、来真的；沼（ぬま）ります／沼（ぬま）る：深陷某个爱好或喜欢上某人（年轻人口语）；「～そう」【N3】表示看起来即将发生。不是节目引语。","polite":"本当（ほんとう）に夢中（むちゅう）になりそうです。","practice":"あの人（ひと）の笑顔（えがお）を見（み）ると、沼（ぬま）りそう。／一看到那个人的笑容，感觉就要沦陷了。","src":"","episode":"2026-10-24原创 · 非节目原话"},{"id":"original-maji-kamo","cat":"暧昧","type":"原创练习","jp":"マジで好（す）きかも。","zh":"我可能真的喜欢上了。","detail":"マジで：真的（随意口语）；好（す）き：喜欢；「～かも」是「～かもしれない」【N3】的省略，表达不确定的推测。","polite":"本当（ほんとう）に好（す）きになったのかもしれません。","practice":"最近（さいきん）、あの子（こ）のことが好（す）きかもしれない。／最近我可能喜欢上那个人了。","src":"","episode":"2026-10-24原创 · 非节目原话"},{"id":"suwon1-wantmeet","cat":"暧昧","type":"报道核实","jp":"会（あ）いたい人（ひと）がいる。","zh":"有一个我想见的人。","detail":"会（あ）います／会（あ）う：见面；「～たい」【N4】表示想做某事。「人（ひと）がいる」说明某个人存在。省略具体是谁，带一点悬念。","polite":"会（あ）いたい人（ひと）がいます。","practice":"もう一度（いちど）、会（あ）いたい人（ひと）がいるんだ。／我有一个想再见一次的人。","src":"https://times.abema.tv/articles/-/10281772","episode":"スウォン編 第1話（2026-10-19放送／10-21报道）；节目参与者发言"},{"id":"takao-final-lover","cat":"告白","type":"报道核实","jp":"恋人（こいびと）になりたいです。","zh":"我想成为你的恋人。","detail":"恋人（こいびと）：恋人；なります／なる：成为。「名词＋になる」【N4】表示变化；「～たい」【N4】表示愿望。礼貌体告白，不属于粗口语。","polite":"あなたとお付（つ）き合（あ）いしたいです。","practice":"友達（ともだち）としてだけじゃなく、恋人（こいびと）になりたい。／不想只做朋友，想成为恋人。","src":"https://times.abema.tv/articles/-/10279790","episode":"タカオ編 最終話（2026-10-12放送／10-14报道）；节目参与者告白"},{"id":"original-stay-longer","cat":"暧昧","type":"原创练习","jp":"もうちょっと一緒（いっしょ）にいたいんだけど。","zh":"还想再和你待一会儿……","detail":"もうちょっと＝再稍微一点；一緒（いっしょ）に＝一起；います／いる：在；「～たい」【N4】愿望；「～んだけど」【N3相关】委婉铺垫，留给对方回应的空间。","polite":"もう少（すこ）し一緒（いっしょ）に過（す）ごせたらうれしいです。","practice":"もうちょっと話（はな）していたいんだけど。／还想再聊一会儿……","src":"","episode":"2026-10-25原创自然练习；非节目原话"},{"id":"original-guess-mutual","cat":"心动","type":"原创练习","jp":"それって、脈（みゃく）ありじゃん？","zh":"那不就说明对方对你有意思吗？","detail":"脈（みゃく）あり：有发展成恋爱关系的希望；「～じゃん」是「～じゃない」的随意口语用法，在此表示发现、确认或轻微反问，并非字面否定。朋友间使用，不适合正式场合。","polite":"それは、好意（こうい）があるということかもしれませんね。","practice":"向（む）こうから誘（さそ）ってくれたの？脈（みゃく）ありじゃん！／是对方主动约你的？那很有戏啊！","src":"","episode":"2026-10-25原创自然练习；非节目原话"},{"id":"incheon2-start-of-love","cat":"心动","type":"报道核实","jp":"好（す）きの始（はじ）まりかも。","zh":"可能是喜欢上一个人的开始。","detail":"好（す）き：喜欢；始（はじ）まり：开始，来自动词始（はじ）まります／始（はじ）まる；「～かも」＝「～かもしれない」【N3】，表示不确定的推测。口语不等于已经确定恋爱。","polite":"好意（こうい）を持（も）ち始（はじ）めたのかもしれません。","practice":"これって、恋（こい）の始（はじ）まりかも。／这也许是恋爱的开始。","src":"https://times.abema.tv/articles/-/10254502","episode":"インチョン編 第2話（2026-06-22放送／06-23报道）；参与者表达"},{"id":"incheon2-invited-maybe","cat":"邀约","type":"报道核实","jp":"誘（さそ）われるかなとか思（おも）ってたんですけど……","zh":"我本来还以为对方可能会约我来着……","detail":"誘（さそ）います／誘（さそ）う：邀请；誘（さそ）われる：被邀请（被动）；思（おも）います／思（おも）う：认为；「～かな」【N3相关】自问式推测；「～とか」弱化引用；「～てた」＝「～ていた」，「～んですけど」委婉转折。","polite":"誘（さそ）っていただけるかもしれないと思（おも）っていたのですが。","practice":"連絡（れんらく）が来（く）るかなと思（おも）ってたんだけど。／我本来还以为会收到消息呢。","src":"https://times.abema.tv/articles/-/10254504","episode":"インチョン編 第2話（2026-06-22放送／06-23报道）；参与者发言"},{"id":"original-sns-exchange","cat":"初次搭话","type":"原创练习","jp":"よかったら、インスタ交換（こうかん）しない？","zh":"方便的话，要不要互加一下Instagram？","detail":"インスタ：英语 Instagram 的日语简称，照片社交平台；交換（こうかん）します／交換（こうかん）する：交换；「～しない？」【N5】用否定疑问委婉邀请；「よかったら」表示如果方便的话。","polite":"よろしければ、インスタを交換（こうかん）しませんか。","practice":"よかったら、SNS交換（こうかん）してもいい？／方便的话，可以交换一下社交账号吗？（SNS：英语 Social Networking Service）","src":"","episode":"2026-10-26原创自然练习；非节目原话"},{"id":"original-little-jealous","cat":"吃醋","type":"原创练习","jp":"ちょっとだけ嫉妬（しっと）しちゃった。","zh":"我稍微有点吃醋了。","detail":"嫉妬（しっと）します／嫉妬（しっと）する：嫉妒、吃醋；「～しちゃった」＝「～してしまった」【N4相关】，带有不由自主、情绪流露的语感；「ちょっとだけ」弱化表达。","polite":"少（すこ）し嫉妬（しっと）してしまいました。","practice":"ほかの子（こ）と仲良（なかよ）く話（はな）してて、ちょっと嫉妬（しっと）しちゃった。／看你和别的人聊得很开心，我有点吃醋了。","src":"","episode":"2026-10-26原创自然练习；非节目原话"}];
const KEY='jlptYouthV1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){saved={}};
const el=id=>document.getElementById(id),safe=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
const addDays=(base,n)=>{const [y,m,d]=base.split('-').map(Number);return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10)};
const due=x=>!!saved[x.id]?.seen&&(saved[x.id].nextDue?saved[x.id].nextDue<=day():saved[x.id].date!==day());
function save(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){alert('浏览器未允许保存进度')}}
function render(){let c=el('cat').value,t=el('type').value,s=el('status').value;
let q=el('search').value.trim().toLowerCase();let shown=DATA.filter(x=>(c==='all'||x.cat===c)&&(t==='all'||x.type===t)&&(s==='all'||s==='fav'&&saved[x.id]?.fav||s==='due'&&due(x)||s==='new'&&!saved[x.id]?.seen)&&(!q||[x.jp,x.zh,x.detail,x.cat].join(' ').toLowerCase().includes(q)));
el('stats').textContent='共 '+DATA.length+' 条 · 已学 '+DATA.filter(x=>saved[x.id]?.seen).length+' · 收藏 '+DATA.filter(x=>saved[x.id]?.fav).length+' · 当前显示 '+shown.length;
el('list').innerHTML=shown.map(x=>'<article class="card" data-id="'+safe(x.id)+'"><p class="tags">'+safe(x.cat)+' · '+safe(x.type)+' · '+safe(x.episode)+'</p><h2 lang="ja">'+safe(x.jp)+'</h2><p><b>中文：</b>'+safe(x.zh)+'</p><p><b>词汇、语法：</b>'+safe(x.detail)+'</p><p><b>更礼貌：</b>'+safe(x.polite)+'</p><p class="practice"><b>自编替换句：</b>'+safe(x.practice)+'</p>'+(x.src?'<p><a class="source" target="_blank" rel="noopener noreferrer" href="'+safe(x.src)+'">ABEMA TIMES 核对出处 ↗</a></p>':'<p class="tags">原创：非节目对白</p>')+'<div class="bar"><button class="btn" data-act="speak">🔊 听发音</button><button class="btn" data-act="fav" aria-pressed="'+!!saved[x.id]?.fav+'">'+(saved[x.id]?.fav?'♥ 已收藏':'♡ 收藏')+'</button><button class="btn" data-act="seen" aria-pressed="'+!!saved[x.id]?.seen+'">'+(saved[x.id]?.seen?(due(x)?'↻ 今日复习':'✓ 已学'):'✓ 标记已学')+'</button></div></article>').join('')||'<div class="card">没有符合条件的表达。</div>';
}
el('list').addEventListener('click',e=>{let b=e.target.closest('button[data-act]');if(!b)return;let x=DATA.find(z=>z.id===b.closest('[data-id]').dataset.id);if(!x)return;
if(b.dataset.act==='speak'){if(!('speechSynthesis' in window)){alert('当前浏览器不支持语音合成');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x.jp.replace(/（[^）]+）/g,''));u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u);return}
let v=saved[x.id]||{};if(b.dataset.act==='fav')v.fav=!v.fav;else if(!v.seen){v.seen=true;v.reviewCount=0;v.date=day();v.nextDue=addDays(day(),1)}else if(due(x)){v.reviewCount=Math.max(0,Number(v.reviewCount)||0)+1;v.date=day();v.nextDue=addDays(day(),[1,3,7,14][Math.min(v.reviewCount,3)])}saved[x.id]=v;save();render()});
['cat','type','status'].forEach(id=>el(id).addEventListener('change',render));
el('search').addEventListener('input',render);
el('export').addEventListener('click',()=>{let blob=new Blob([JSON.stringify({format:KEY,created:new Date().toISOString(),items:saved},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='koi-youth-progress-20261026.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});
el('import').addEventListener('click',()=>el('backup').click());
el('backup').addEventListener('change',async e=>{
const f=e.target.files[0];if(!f)return;
try{
if(f.size>100000)throw Error('备份文件超过100KB');
const b=JSON.parse(await f.text());
if(b.format!==KEY||!b.items||typeof b.items!=='object'||Array.isArray(b.items))throw Error('格式不符');
let merged=0;
const validDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d);
for(const [id,v] of Object.entries(b.items)){
if(!/^[a-z0-9][a-z0-9-]{0,90}$/.test(id)||!v||typeof v!=='object'||Array.isArray(v))continue;
const old=saved[id]&&typeof saved[id]==='object'?saved[id]:{};
const incomingDate=validDate(v.date)?v.date:'';
const oldDate=validDate(old.date)?old.date:'';
const newer=incomingDate>=oldDate;
saved[id]={...old,
fav:!!old.fav||!!v.fav,
seen:!!old.seen||!!v.seen,
date:newer?(incomingDate||oldDate):(oldDate||incomingDate),
nextDue:newer?(validDate(v.nextDue)?v.nextDue:old.nextDue):(old.nextDue||(validDate(v.nextDue)?v.nextDue:undefined)),
reviewCount:Math.min(100,Math.max(0,Number.isInteger(old.reviewCount)?old.reviewCount:0,Number.isInteger(v.reviewCount)?v.reviewCount:0))};
merged++;
}
save();render();el('stats').textContent+=' · 已安全合并 '+merged+' 条（保留已有收藏及未来版本记录）';
}catch(err){el('stats').textContent='导入失败：'+(err.message||'请检查本栏目JSON备份')}
finally{e.target.value=''}
});

const QS=[{"q":"「ヤキモチ妬（や）いちゃって」の「ちゃって」对应什么？","opts":["～てしまって","～ておいて","～てみて","～てあげて"],"answer":0,"why":"「妬（や）いてしまって」的口语缩略，带有情绪或后悔。"},{"q":"「誘（さそ）われるかなとか思（おも）ってたんですけど」の「かな」表示什么？","opts":["强烈命令","不确定的猜测、自问","已经确定的事实","禁止邀请"],"answer":1,"why":"「～かな」表达不确定的猜测；「～とか思ってた」表示原本隐约这样想。"},{"q":"听到「目（め）、見（み）られねえ」，最自然的理解是？","opts":["看得特别清楚","不敢看对方的眼睛","让别人看一眼","希望别人闭眼"],"answer":1,"why":"「見（み）られない」口语中可说「見（み）られねえ」，语气较粗，不适合正式场合。"}];
el('quiz').innerHTML=QS.map((q,i)=>'<section data-q="'+i+'"><p><b>'+(i+1)+'. '+q.q+'</b></p>'+q.opts.map((o,j)=>'<button class="btn" data-choice="'+j+'">'+safe(o)+'</button>').join('')+'<p class="muted" aria-live="polite"></p></section>').join('');
el('quiz').addEventListener('click',e=>{let b=e.target.closest('button[data-choice]');if(!b||b.disabled)return;let s=b.closest('[data-q]'),q=QS[+s.dataset.q],chosen=+b.dataset.choice;s.querySelectorAll('button').forEach(z=>{z.disabled=true;if(+z.dataset.choice===q.answer)z.classList.add('correct');else if(+z.dataset.choice===chosen)z.classList.add('wrong')});s.querySelector('[aria-live]').textContent=(chosen===q.answer?'答对了！':'答错了。')+q.why});
render();})();</script></body></html>
