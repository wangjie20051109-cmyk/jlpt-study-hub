<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>考试刷题 · JLPT Study Hub</title>
<style>
:root{--ink:#202733;--muted:#78808d;--line:#e8ebf1;--blue:#5075eb;--mint:#19a78c;--mintbg:#e5f8f3;--red:#d95058;--redbg:#fff1f2;--bg:#f5f7fb;--paper:white}
*{box-sizing:border-box}body{margin:0;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #9baefa;outline-offset:2px}
.layout{max-width:780px;margin:0 auto;min-height:100vh;padding:0 16px 110px}
header{display:flex;align-items:center;gap:12px;padding:19px 0 13px;background:var(--bg)}
header a{display:grid;place-items:center;width:40px;height:40px;text-decoration:none;border-radius:50%;color:var(--ink);font-size:25px;background:#fff}
.hd{flex:1;min-width:0}.hd b{display:block;font-size:19px}.hd small{display:block;font-size:12px;color:var(--muted)}
.pill{padding:3px 8px;border-radius:99px;background:#eef2ff;color:#4f64ad;font-size:11px;white-space:nowrap;font-weight:700}
.panel{background:var(--paper);border-radius:20px;box-shadow:0 3px 18px rgba(32,43,78,.035);margin:12px 0;padding:20px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters label{font-size:12px;color:var(--muted);display:block}
.filters select{display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-weight:700}
.mode{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}.mode button{border:1px solid var(--line);background:white;color:#596373;border-radius:999px;padding:7px 13px;font-size:13px}
.mode button.active{background:#eaf3ff;color:#3062d7;border-color:#afc9fa;font-weight:700}
.stats{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:10px}
.bar{height:6px;background:#eef1f5;border-radius:50px;overflow:hidden}.bar i{display:block;background:linear-gradient(90deg,#58d6c2,#5895e9);height:100%;transition:width .25s}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 17px}.qmeta .tag{font-size:12px;font-weight:700;color:#3c8476;background:#e9f7f2;border-radius:7px;padding:3px 9px}
.qprompt{font-size:22px;line-height:2.2;font-weight:650;letter-spacing:.1px;white-space:pre-wrap;overflow-wrap:anywhere}
ruby{ruby-position:over}rt{font-size:.48em;color:#7f8d9c;font-weight:400;user-select:none}
.no-ruby rt{visibility:hidden}
.trans{margin:8px 0 14px;padding:9px 12px;border-left:3px solid #a4c5ec;background:#f6f9fd;color:#657084;font-size:13px}
.choices{display:grid;gap:12px;margin:22px 0 12px}
.choice{display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:16px;min-height:76px;padding:13px 16px;background:white;color:var(--ink)}
.choice .num{width:28px;height:28px;flex:none;border-radius:9px;display:grid;place-items:center;background:#eff2f6;color:#7c8999;font-weight:700;font-size:15px}
.choice .jp{font-size:19px;font-weight:650}.choice.selected{background:#edf2ff;border-color:var(--blue)}.choice.selected .num{background:var(--blue);color:white}
.choice.correct{background:var(--mintbg);border-color:var(--mint)}.choice.correct .num{background:var(--mint);color:white}
.choice.wrong{background:var(--redbg);border-color:var(--red)}.choice.wrong .num{background:var(--red);color:white}
.choice:disabled{opacity:1;cursor:default}
.tiny{font-size:12px;color:var(--muted)}.action{display:flex;gap:10px;margin-top:14px}.action button{min-height:46px;border-radius:12px;border:1px solid #dce3ee;background:white;padding:10px 16px}
.action .primary{flex:1;background:var(--blue);color:white;font-weight:750;border-color:var(--blue)}.action .primary:disabled{background:#e1e5ef;border-color:#e1e5ef;color:#99a1ae}
.bookmark{border:1px solid #e7ebef;background:#fff;border-radius:11px;padding:5px 12px;font-size:19px;color:#a3aab4}.bookmark.active{color:#db8a17;background:#fff5df}
.result{margin-top:20px;border-top:1px solid var(--line);padding-top:18px}
.resultTitle{display:flex;align-items:center;gap:8px;font-weight:750;font-size:17px}.resultTitle.good{color:#168e75}.resultTitle.bad{color:#cb4b5b}
.explainTitle{font-size:16px;margin:20px 0 8px;font-weight:800}.point{padding:14px 16px;background:#f1f6fe;border-radius:13px}
.reasons{display:grid;gap:10px}.reason{border:1px solid var(--line);border-radius:13px;padding:12px 14px}
.reason.good{border-color:#b2e3d5;background:#f3fbf8}
.reasonHead{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:750}.reason p{font-size:13px;color:#5a6675;margin:6px 0 0}
.example{background:#f8f9fc;border-radius:14px;padding:14px 16px;margin-top:10px;line-height:2.2}
.navBottom{position:fixed;bottom:0;left:0;width:100%;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom))}
.navBottom .wrap{max-width:748px;margin:auto;display:flex;gap:10px}.navBottom button{flex:1;padding:12px 8px;border-radius:12px;border:1px solid #e0e5ee;background:#fff;min-height:49px;color:#4e5d6b}.navBottom button.next{background:var(--blue);color:white;border-color:var(--blue);font-weight:750}
.navBottom button:disabled{opacity:.4}
.empty{text-align:center;padding:45px 12px;color:var(--muted)}
.summary{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;color:#667288;font-size:13px}
@media(max-width:480px){.layout{padding:0 12px 110px}.panel{padding:16px}.qprompt{font-size:20px}.choice .jp{font-size:18px}.choice{min-height:74px}.hd b{font-size:18px}}
html.study-no-furigana rt{display:none}.study-loan{font-size:.73em;color:#566079}</style>
<link rel="stylesheet" href="./site.css?v=20261016m1"><style>body{background:#f7f8fa}.layout{padding-bottom:195px}.navBottom{bottom:calc(63px + env(safe-area-inset-bottom));z-index:15}.bottomnav{z-index:20}@media(max-width:480px){.layout{padding-bottom:200px}}</style></head><body><div class="layout">
<header><a href="./" aria-label="返回学习站首页">‹</a><div class="hd"><b>考试刷题 · JLPT Study Hub</b><small>手机刷题 · 假名 · 中文精讲 · 自动错题本</small></div><span class="pill">原创模拟题</span></header>
<div class="panel">
<div class="filters"><label>考试等级<select id="level"><option value="N2">N2 · 冲刺</option><option value="N3">N3 · 巩固</option></select></label><label>专项类型<select id="type"><option value="all">综合训练</option><option value="grammar">语法</option><option value="vocab">原有文字词汇</option><option value="reading">汉字读音（700题）</option><option value="writing">假名选汉字（300题）</option></select></label></div>
<div class="mode" role="group" aria-label="练习模式"><button class="active" data-mode="unseen">📝 未做新题</button><button data-mode="all">全部题目</button><button data-mode="wrong">❌ 错题重练</button><button data-mode="star">☆ 收藏夹</button></div>
<p style="margin:12px 0 0;font-size:13px">🧩 <a href="./grammar.html" style="color:#078c80;font-weight:750">打开全新语法App：四选一 + 上拉解析 + 词汇收藏 →</a></p>
<div class="summary"><span id="allStat"></span><button id="exportWrong" type="button" style="padding:5px 10px;border:1px solid #dae3ef;border-radius:9px;background:white;color:#3f65a3;font-size:12px">↓ 导出错题笔记</button><label><input id="furigana" type="checkbox" checked> 显示假名</label></div>
</div>
<div class="panel" id="workspace" aria-live="polite">
<div class="stats"><span id="counter">1 / 1</span><span id="correctStat">已答 0 · 正确 0</span></div><div class="bar"><i id="progress"></i></div>
<div id="qbody"></div>
</div>
<p class="tiny" style="text-align:center">新增1000道词汇读音／写法题（N2 500＋N3 500），另保留原有18道模拟题。数据来自 <a href="https://github.com/allenlu2009/japanese-learning-datasets" target="_blank" rel="noopener">MIT 开源词表</a>，释义暂提供英文；<a href="./practice-bank-NOTICE.md">来源及授权</a>。并非官方历年真题。学习记录仅保存在当前浏览器。</p>
</div>
<div class="navBottom"><div class="wrap"><button id="prev">← 上一题</button><button class="next" id="next">下一题 →</button></div></div>
<script src="./practice_data_n2.js?v=20261016a"></script>
<script src="./practice_data_n3.js?v=20261016a"></script>
<script src="./practice_bulk_runtime.js?v=20261104zh1"></script>
<script src="./study/shared.js?v=1"></script>
<script src="./study/practice-original.js?v=1"></script>
<script>
(function(){
'use strict';
const BANK=window.JLPT_PRACTICE_ORIGINAL.slice();
const BULK_ADDED=window.addJLPTBulkQuiz?window.addJLPTBulkQuiz(BANK):{n2:0,n3:0};
const K='jlptPracticeV2State';
let saved={answers:{},wrong:{},star:{}};try{const v=JSON.parse(localStorage.getItem(K)||'{}');saved={answers:v.answers||{},wrong:v.wrong||{},star:v.star||{}}}catch(e){}
let mode='unseen',idx=0,selected=null,justAnsweredId=null;
const $=id=>document.getElementById(id);
function persist(){try{localStorage.setItem(K,JSON.stringify(saved))}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function ruby(s){return window.JLPT_STUDY.rich(s)}
function pool(){let l=$('level').value,t=$('type').value;return BANK.filter(q=>q.l===l&&(t==='all'||q.t===t)&&(mode==='all'||(mode==='unseen'?(!saved.answers[q.id]||q.id===justAnsweredId):(mode==='wrong'?saved.wrong[q.id]:saved.star[q.id]))))}
function qStat(){let all=Object.values(saved.answers);return {n:all.length,ok:all.filter(x=>x.correct).length}}
function render(){
let arr=pool();const s=qStat();
$('allStat').textContent='累计已做 '+s.n+' 题 · 正确率 '+(s.n?Math.round(s.ok/s.n*100):0)+'% · 错题 '+Object.keys(saved.wrong).filter(x=>saved.wrong[x]).length;
if(idx>=arr.length)idx=Math.max(0,arr.length-1);
$('prev').disabled=idx===0||!arr.length;$('next').disabled=mode==='unseen'?(!arr.length||(!justAnsweredId&&idx>=arr.length-1)):idx>=arr.length-1||!arr.length;
$('counter').textContent=arr.length?(idx+1)+' / '+arr.length:'0 / 0';$('progress').style.width=arr.length?((idx+1)/arr.length*100)+'%':'0%';
$('correctStat').textContent='已做 '+s.n+' · 答对 '+s.ok;
if(!arr.length){$('qbody').innerHTML='<div class="empty"><b>这里还没有题目</b><p>切回「全部题目」开始练习，答错的题会自动进入错题本。</p></div>';return}
let q=arr[idx],old=saved.answers[q.id],ans=old?old.selected:null,done=!!old,chosen=done?ans:selected;
let body='<div class="qmeta"><span class="tag">'+q.l+' · '+(q.t==='grammar'?'语法':q.t==='reading'?'汉字读音':q.t==='writing'?'汉字书写':'词汇')+'</span><button id="starBtn" class="bookmark '+(saved.star[q.id]?'active':'')+'" aria-label="收藏当前题">'+(saved.star[q.id]?'★':'☆')+'</button></div>'+
'<div class="qprompt">'+ruby(q.q)+'</div>'+(done?'<div class="trans">'+esc(q.zh)+'</div>':'')+
'<div class="choices">'+q.o.map((o,i)=>{let cls=done?(i===q.a?' correct':i===ans?' wrong':''):(i===chosen?' selected':'');return '<button class="choice'+cls+'" data-answer="'+i+'" '+(done?'disabled':'')+'><span class="num">'+(i+1)+'</span><span class="jp">'+ruby(o[0])+'</span>'+(done?'<span style="display:block;font-size:13px;color:#65758c;text-align:left;margin-top:3px">'+esc(o[1])+'</span>':'')+'</button>'}).join('')+'</div>'+
'<div class="action"><button id="submit" class="primary" '+(done||chosen===null?'disabled':'')+'>'+(done?'已提交':'提交答案')+'</button><button id="retry" '+(!done?'disabled':'')+'>↻ 重练</button></div>';
if(done){body+='<div class="result"><div class="resultTitle '+(old.correct?'good':'bad')+'">'+(old.correct?'✓ 回答正确！':'✕ 回答错误')+' 正确答案：'+(q.a+1)+' '+ruby(q.o[q.a][0])+'</div>'+
'<h3 class="explainTitle">📖 语法／词汇重点</h3><div class="point"><b>'+esc(q.pattern)+'</b><div style="margin-top:6px;font-size:14px">'+esc(q.tip)+'</div></div>'+
'<h3 class="explainTitle">四个选项逐个分析</h3><div class="reasons">'+q.o.map((o,i)=>'<div class="reason '+(i===q.a?'good':'')+'"><div class="reasonHead">'+(i===q.a?'✅':'✕')+' '+(i+1)+' '+ruby(o[3]||o[0])+' · '+esc(o[1])+'</div><p>'+esc(o[2])+'</p></div>').join('')+'</div>'+
'<h3 class="explainTitle">'+(q.source==='MIT-vocab'?'目标词汇 · 正确假名':'例句 · 汉字注音')+'</h3><button id="playEx" type="button" style="border:1px solid #b8dfd4;border-radius:9px;padding:6px 11px;background:#effaf6;color:#168970">🔊 朗读例句</button><div class="example">'+ruby(q.ex)+'<div style="font-size:13px;color:#65758c">'+esc(q.exzh)+'</div></div>'+
'<h3 class="explainTitle">⚠️ 易混考点</h3><div class="point">'+esc(q.mix)+'</div>'+
'<div class="tiny" style="margin-top:12px">错题会保留在错题本中，直到你手动选择「已掌握」。</div>'+
(saved.wrong[q.id]?'<button id="mastered" style="margin-top:12px;padding:9px 13px;border:1px solid #a8d7c9;border-radius:10px;color:#168970;background:#effaf6">✓ 已掌握，移出错题本</button>':'')+'</div>';}
$('qbody').innerHTML=body;
document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',function(){if(done)return;selected=Number(b.dataset.answer);render()}));
$('starBtn').onclick=()=>{saved.star[q.id]=!saved.star[q.id];persist();render()};
$('submit').onclick=()=>{if(done||selected===null)return;let correct=selected===q.a;saved.answers[q.id]={selected:selected,correct:correct,at:new Date().toISOString()};if(!correct)saved.wrong[q.id]=true;window.JLPT_STUDY.submit((q.t==='grammar'?'grammar:':'practice:')+q.id,correct);justAnsweredId=q.id;persist();selected=null;render()};
$('retry').onclick=()=>{delete saved.answers[q.id];justAnsweredId=null;selected=null;persist();render()};if($('playEx'))$('playEx').onclick=()=>window.JLPT_STUDY.play(q.ex,{report:message=>{$('playEx').title=message;}});
if($('mastered'))$('mastered').onclick=()=>{delete saved.wrong[q.id];persist();render()};
}
function reset(){idx=0;selected=null;justAnsweredId=null;render()}
$('level').onchange=reset;$('type').onchange=()=>{if($('type').value==='grammar'){location.href='./grammar.html?level='+$('level').value;return}reset()};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));reset()});
$('next').onclick=()=>{if(mode==='unseen'){if(justAnsweredId){justAnsweredId=null;idx=0}else if(idx<pool().length-1)idx++;selected=null;render();return}if(idx<pool().length-1){idx++;selected=null;render()}};
$('prev').onclick=()=>{if(idx>0){idx--;selected=null;render()}};
$('furigana').checked=window.JLPT_STUDY.hasFurigana();$('furigana').onchange=()=>window.JLPT_STUDY.setFurigana($('furigana').checked);
$('exportWrong').onclick=()=>{const w=BANK.filter(q=>saved.wrong[q.id]);if(!w.length)return alert('目前还没有错题，做错的题会自动收录。');const clean=x=>String(x||'').replace(/\[([^\]|]+)\|[^\]]+\]/g,'$1');const lines=['# JLPT Study Hub · 错题本','', '生成时间：'+new Date().toLocaleString('zh-CN'),''];w.forEach((q,i)=>{lines.push('## '+(i+1)+'. '+q.l+' '+(q.t==='grammar'?'语法':'词汇'),'','题目：'+clean(q.q),'中文：'+q.zh,'接续：'+q.pattern,'说明：'+q.tip,'');q.o.forEach((o,j)=>lines.push((j+1)+'. '+clean(o[0])+' | '+o[1]+' | '+o[2]+(j===q.a?' ✓':'')));lines.push('','例句：'+clean(q.ex),'例句翻译：'+q.exzh,'易混点：'+q.mix,'','---','')});const blob=new Blob([lines.join('\n')],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='JLPT错题本.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
const qs=new URLSearchParams(location.search);
if(['N2','N3'].includes(qs.get('level')))$('level').value=qs.get('level');
if(['all','grammar','vocab','reading','writing'].includes(qs.get('type')))$('type').value=qs.get('type');
if(qs.get('type')==='grammar'){location.replace('./grammar.html?level='+$('level').value);return;}
if(['unseen','all','wrong','star'].includes(qs.get('mode')))mode=qs.get('mode');
document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
const wanted=qs.get('focus');
if(wanted){const at=pool().findIndex(x=>x.id===wanted);if(at>=0)idx=at;}
render();
})();
</script>
