{id:'n2-01',l:'N2',t:'grammar',q:'この[店|みせ]では、[客|きゃく]の[予算|よさん]（　）、[料理|りょうり]の[内容|ないよう]を[変|か]えている。',zh:'这家店会根据客人的预算调整料理内容。',o:[['に[比|くら]べて','与……相比','比较两个对象，这里不是在比较预算'],['に[先立|さきだ]って','在……之前','用于某事件开始之前的动作，不表示预算差异'],['に[応|おう]じて','根据……、按照……','预算不同，料理内容随之调整，符合条件变化'],['に[向|む]けて','朝向……、为了……','表示面向目标或方向，不是按条件调整']],a:2,pattern:'名词＋に応（おう）じて',tip:'表示根据情况、需求、能力等条件而改变方式或程度。常见搭配：予算・希望・能力・状況＋に応じて。',mix:'「に応じて」随条件变化；「に向けて」朝目标努力；「に比べて」作比较。',ex:'[能力|のうりょく]に[応|おう]じて、[仕事|しごと]を[任|まか]せます。',exzh:'根据能力分配工作。'},

{id:'n2-08',l:'N2',t:'grammar',q:'[彼|かれ]は[英語|えいご]（　）、[中国語|ちゅうごくご]も[話|はな]せる。',zh:'他不仅会英语，还会说中文。',o:[['ばかりか','不仅……而且……','正确；在前项之外再追加超出预期的内容'],['ばかりに','只因为……','强调原因导致结果'],['ばかりだ','只会不断……','表示变化朝一个方向发展'],['ばかりで','只是……、光是……','接续和语义都不符合']],a:0,pattern:'名词／普通形＋ばかりか',tip:'强调不仅有A，而且还有B。后项通常是追加的更强或意外信息。',mix:'「ばかりか」追加；「ばかりに」后悔原因；「ばかりだ」不断发展。',ex:'[雨|あめ]ばかりか、[強|つよ]い[風|かぜ]も[吹|ふ]いている。',exzh:'不仅下雨，还刮着大风。'},
{id:'n2-09',l:'N2',t:'grammar',q:'[一度|いちど][引|ひ]き[受|う]けた（　）、[最後|さいご]まで[責任|せきにん]を[持|も]つべきだ。',zh:'既然已经接受了，就应该负责到底。',o:[['からには','既然……就……','正确；已决定或发生的事情带来责任'],['にしては','就……而言却……','表示反差，不是责任'],['につれて','随着……','表示连动变化'],['をめぐって','围绕……','表示议论争端的主题']],a:0,pattern:'普通形＋からには',tip:'表示“既然决定或做到某事，就理应……”，后项经常是义务、决心、责任。',mix:'「以上（いじょう）は」与「からには」意思接近，语气都较坚定。',ex:'[約束|やくそく]したからには、[必|かなら]ず[守|まも]る。',exzh:'既然答应了，就一定遵守。'},

{id:'n3-01',l:'N3',t:'grammar',q:'[日本|にほん]へ[来|き]て（　）、[毎日|まいにち][日本語|にほんご]を[使|つか]っている。',zh:'来到日本以后，我每天都使用日语。',o:[['から','……之后、从……以来','正确；Vてから表示动作完成后持续的事情'],['まで','直到……','表示终点，接续不合'],['ほど','达到……程度','表达程度，不是时间起点'],['しか','只有……（后接否定）','后面不是否定形式']],a:0,pattern:'动词て形＋から',tip:'表示在A动作之后发生B，也能表示从A以后一直保持B。',mix:'「たあとで」仅表示先后；「てから」更强调完成A再开始B。',ex:'[宿題|しゅくだい]をしてから、[寝|ね]ます。',exzh:'做完作业后睡觉。'},
{id:'n3-02',l:'N3',t:'grammar',q:'[明日|あした]は[早|はや]いので、[今日|きょう]は[早|はや]く[寝|ね]る（　）。',zh:'明天要早起，所以我决定今天早点睡。',o:[['ことにする','决定做……','正确；说话人自己的决定'],['ことになる','（外部因素）决定……','多用于客观安排或被决定'],['ようになる','变得能够……、开始……','表示能力习惯变化'],['ところだった','险些……','表示差点发生的事情']],a:0,pattern:'动词辞书形／ない形＋ことにする',tip:'主语有意志，自行决定做或不做某事。',mix:'「ことにする」自己决定；「ことになる」制度或他人安排决定，N3常考。',ex:'[毎朝|まいあさ][走|はし]ることにしました。',exzh:'我决定每天早晨跑步。'},
{id:'n3-03',l:'N3',t:'grammar',q:'[忘|わす]れない（　）、スマホにメモしておく。',zh:'为了不忘记，我先在手机里记下来。',o:[['ように','为了能够……／为了避免……','正确；目标是保持“不忘记”的状态'],['ためで','因为……','接续不正确；通常是「ために」'],['そうに','看上去……地','样态表达，不表示目的'],['らしく','像……一样','表示典型特征']],a:0,pattern:'动词辞书形／ない形＋ように',tip:'表示为了实现某种状态、避免某种情况。和可能形、ない形搭配很多。',mix:'「ために」常搭配意志性动作目的；「ように」常搭配能力或状态的实现。',ex:'[遅刻|ちこく]しないように、[早|はや]く[出|で]ます。',exzh:'为了不迟到，早点出门。'},
{id:'n3-04',l:'N3',t:'grammar',q:'この[荷物|にもつ]は[重|おも]すぎて、[一人|ひとり]では[運|はこ]び（　）。',zh:'这件行李太重，一个人不好搬。',o:[['やすい','容易……','含义相反'],['にくい','难以……','正确；动词ます形去ます＋にくい'],['そうだ','看起来要……','形态和语义不合'],['たがる','（第三人称）想要……','表示愿望，不是困难']],a:1,pattern:'动词ます形去掉ます＋にくい',tip:'表示做某个动作比较困难；如「読みにくい」「使いにくい」。',mix:'「にくい」难做；「づらい」多带主观难受或心理上的困难。',ex:'この[字|じ]は[小|ちい]さくて[読|よ]みにくい。',exzh:'这字太小，不好读。'},
{id:'n3-05',l:'N3',t:'grammar',q:'[雨|あめ]が[降|ふ]っている（　）、[試合|しあい]は[予定|よてい][通|どお]り[行|おこな]われた。',zh:'虽然下雨了，比赛还是按计划举行。',o:[['ので','因为……','表示原因，难以说明逆接'],['のに','明明……却……','正确；前后预期相反'],['ために','由于／为了……','原因或目的，不是逆接'],['ながら','一边……一边……','一般接动词ます形，不合']],a:1,pattern:'普通形＋のに',tip:'逆接表达，前后实际情况和预期相反，常带意外、遗憾等情绪。',mix:'「けれども」只是一般转折；「のに」更有出乎意料的感觉。',ex:'[勉強|べんきょう]したのに、[間違|まちが]えた。',exzh:'明明学习过了，却还是做错了。'},
{id:'n3-06',l:'N3',t:'grammar',q:'[旅行|りょこう]の[前|まえ]に、ホテルを[予約|よやく]して（　）。',zh:'旅行前先把酒店订好（为以后做准备）。',o:[['しまう','做完／不小心……','强调完结或遗憾，不强调提前准备'],['おく','事先做好准备','正确；Vておく表示为将来提前准备'],['みる','试着做……','表示尝试而不是准备'],['くる','开始／朝这边来','表示趋向变化或动作移动']],a:1,pattern:'动词て形＋おく',tip:'事先做某事，方便之后的安排。日常里「とく」是「ておく」的口语缩约。',mix:'「てしまう」着重动作完成或遗憾；「ておく」重视为之后做准备。',ex:'[試験|しけん]の[前|まえ]に、[単語|たんご]を[復習|ふくしゅう]しておく。',exzh:'考试前先复习单词。'},
{id:'n2-11',l:'N2',t:'vocab',q:'[彼|かれ]の[説明|せつめい]は[具体性|ぐたいせい]に（　）、[説得力|せっとくりょく]がなかった。',zh:'他的说明缺乏具体性，没有说服力。',o:[['[欠|か]けて','缺乏……','正确；「～に欠ける」表示缺少必要条件'],['[抜|ぬ]けて','脱落、漏掉','常说「ページが抜ける」而非「具体性に抜ける」'],['[外|はず]れて','脱离、偏离','常说「予想が外れる」而非本句的搭配'],['[離|はな]れて','离开、远离','常说「駅から離れる」，不用于具体性欠缺']],a:0,pattern:'名词＋に欠（か）ける',tip:'形容能力、礼貌、具体性等方面缺少应有的要素，是N2常见搭配。',mix:'「欠ける」缺乏一部分；「抜ける」从某处脱落或遗漏。',ex:'この[計画|けいかく]は[安全性|あんぜんせい]に[欠|か]ける。',exzh:'这个计划缺乏安全性。'},
{id:'n3-07',l:'N3',t:'vocab',q:'[先生|せんせい]に[作文|さくぶん]の[間違|まちが]いを（　）もらいました。',zh:'我请老师帮我修改了作文里的错误。',o:[['[直|なお]して','修改、修好','正确；修改文章、机械等用「直す」'],['[治|なお]して','治好','主要表示治病或治伤'],['[戻|もど]して','恢复、归还','强调回到原状态或原处'],['[変|か]えて','更换、改变','虽可改变内容，但「間違いを直す」是自然固定搭配']],a:0,pattern:'名词＋を直（なお）す／动词て形＋もらう',tip:'「直す」用于改错、修理；「治す」用于疾病。此句的「～てもらう」表示请他人帮助做。',mix:'同音词「直す（修正）」和「治す（治病）」在JLPT词汇题中很容易混淆。',ex:'[文章|ぶんしょう]を[直|なお]してもらいました。',exzh:'请别人帮我修改了文章。'}
];
const BULK_ADDED=window.addJLPTBulkQuiz?window.addJLPTBulkQuiz(BANK):{n2:0,n3:0};
const K='jlptPracticeV2State';
let saved={answers:{},wrong:{},star:{}};try{const v=JSON.parse(localStorage.getItem(K)||'{}');saved={answers:v.answers||{},wrong:v.wrong||{},star:v.star||{}}}catch(e){}
let mode='unseen',idx=0,selected=null,justAnsweredId=null;
const $=id=>document.getElementById(id);
function persist(){try{localStorage.setItem(K,JSON.stringify(saved))}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function ruby(s){return esc(s).replace(/\[([^\]|]+)\|([^\]]+)\]/g,'<ruby>$1<rt>$2</rt></ruby>')}
function pool(){let l=$('level').value,t=$('type').value;return BANK.filter(q=>q.l===l&&(t==='all'||q.t===t)&&(mode==='all'||(mode==='unseen'?(!saved.answers[q.id]||q.id===justAnsweredId):(mode==='wrong'?saved.wrong[q.id]:saved.star[q.id]))))}
function qStat(){let all=Object.values(saved.answers);return {n:all.length,ok:all.filter(x=>x.correct).length}}
function render(){
let arr=pool();const s=qStat();
$('allStat').textContent='累计已做 '+s.n+' 题 · 正确率 '+(s.n?Math.round(s.ok/s.n*100):0)+'% · 错题 '+Object.keys(saved.wrong).filter(x=>saved.wrong[x]).length;
if(idx>=arr.length)idx=Math.max(0,arr.length-1);
$('prev').disabled=idx===0||!arr.length;$('next').disabled=mode==='unseen'?(!arr.length||(!justAnsweredId&&idx>=arr.length-1)):idx>=arr.length-1||!arr.length;
$('counter').textContent=arr.length?(idx+1)+' / '+arr.length:'0 / 0';$('progress').style.width=arr.length?((idx+1)/arr.length*100)+'%':'0%';
$('correctStat').textContent='已做 '+s.n+' · 答对 '+s.ok;
if(!arr.length){$('qbody').innerHTML='<div class="empty"><b>这里还没有题目</b><p>切回「全部题目」开始练习，答错的题会自动进入错题本。</p></div>';return}
let q=arr[idx],old=saved.answers[q.id],ans=old?old.selected:null,done=!!old,chosen=done?ans:selected;
let body='<div class="qmeta"><span class="tag">'+q.l+' · '+(q.t==='grammar'?'语法':q.t==='reading'?'汉字读音':q.t==='writing'?'汉字书写':'词汇')+'</span><button id="starBtn" class="bookmark '+(saved.star[q.id]?'active':'')+'" aria-label="收藏当前题">'+(saved.star[q.id]?'★':'☆')+'</button></div>'+
'<div class="qprompt">'+ruby(q.q)+'</div>'+(done?'<div class="trans">'+esc(q.zh)+'</div>':'')+
'<div class="choices">'+q.o.map((o,i)=>{let cls=done?(i===q.a?' correct':i===ans?' wrong':''):(i===chosen?' selected':'');return '<button class="choice'+cls+'" data-answer="'+i+'" '+(done?'disabled':'')+'><span class="num">'+(i+1)+'</span><span class="jp">'+ruby(o[0])+'</span></button>'}).join('')+'</div>'+
'<div class="action"><button id="submit" class="primary" '+(done||chosen===null?'disabled':'')+'>'+(done?'已提交':'提交答案')+'</button><button id="retry" '+(!done?'disabled':'')+'>↻ 重练</button></div>';
if(done){body+='<div class="result"><div class="resultTitle '+(old.correct?'good':'bad')+'">'+(old.correct?'✓ 回答正确！':'✕ 回答错误')+' 正确答案：'+(q.a+1)+' '+ruby(q.o[q.a][0])+'</div>'+
'<h3 class="explainTitle">📖 语法／词汇重点</h3><div class="point"><b>'+esc(q.pattern)+'</b><div style="margin-top:6px;font-size:14px">'+esc(q.tip)+'</div></div>'+
'<h3 class="explainTitle">四个选项逐个分析</h3><div class="reasons">'+q.o.map((o,i)=>'<div class="reason '+(i===q.a?'good':'')+'"><div class="reasonHead">'+(i===q.a?'✅':'✕')+' '+(i+1)+' '+ruby(o[3]||o[0])+' · '+esc(o[1])+'</div><p>'+esc(o[2])+'</p></div>').join('')+'</div>'+
'<h3 class="explainTitle">'+(q.source==='MIT-vocab'?'目标词汇 · 正确假名':'例句 · 汉字注音')+'</h3><button id="playEx" type="button" style="border:1px solid #b8dfd4;border-radius:9px;padding:6px 11px;background:#effaf6;color:#168970">🔊 朗读例句</button><div class="example">'+ruby(q.ex)+'<div style="font-size:13px;color:#65758c">'+esc(q.exzh)+'</div></div>'+
'<h3 class="explainTitle">⚠️ 易混考点</h3><div class="point">'+esc(q.mix)+'</div>'+
'<div class="tiny" style="margin-top:12px">错题会保留在错题本中，直到你手动选择「已掌握」。</div>'+
(saved.wrong[q.id]?'<button id="mastered" style="margin-top:12px;padding:9px 13px;border:1px solid #a8d7c9;border-radius:10px;color:#168970;background:#effaf6">✓ 已掌握，移出错题本</button>':'')+'</div>';}
$('qbody').innerHTML=body;
document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',function(){if(done)return;selected=Number(b.dataset.answer);render()}));
$('starBtn').onclick=()=>{saved.star[q.id]=!saved.star[q.id];persist();render()};
$('submit').onclick=()=>{if(done||selected===null)return;let correct=selected===q.a;saved.answers[q.id]={selected:selected,correct:correct,at:new Date().toISOString()};if(!correct)saved.wrong[q.id]=true;justAnsweredId=q.id;persist();selected=null;render()};
$('retry').onclick=()=>{delete saved.answers[q.id];justAnsweredId=null;selected=null;persist();render()};if($('playEx'))$('playEx').onclick=()=>{if(!('speechSynthesis' in window))return alert('当前浏览器不支持日语语音播放');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(q.ex.replace(/\[([^\]|]+)\|[^\]]+\]/g,'$1'));u.lang='ja-JP';u.rate=.88;speechSynthesis.speak(u)};
if($('mastered'))$('mastered').onclick=()=>{delete saved.wrong[q.id];persist();render()};
}
function reset(){idx=0;selected=null;justAnsweredId=null;render()}
$('level').onchange=reset;$('type').onchange=reset;
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));reset()});
$('next').onclick=()=>{if(mode==='unseen'){if(justAnsweredId){justAnsweredId=null;idx=0}else if(idx<pool().length-1)idx++;selected=null;render();return}if(idx<pool().length-1){idx++;selected=null;render()}};
$('prev').onclick=()=>{if(idx>0){idx--;selected=null;render()}};
$('furigana').onchange=()=>{document.body.classList.toggle('no-ruby',!$('furigana').checked)};
$('exportWrong').onclick=()=>{const w=BANK.filter(q=>saved.wrong[q.id]);if(!w.length)return alert('目前还没有错题，做错的题会自动收录。');const clean=x=>String(x||'').replace(/\[([^\]|]+)\|[^\]]+\]/g,'$1');const lines=['# JLPT Study Hub · 错题本','', '生成时间：'+new Date().toLocaleString('zh-CN'),''];w.forEach((q,i)=>{lines.push('## '+(i+1)+'. '+q.l+' '+(q.t==='grammar'?'语法':'词汇'),'','题目：'+clean(q.q),'中文：'+q.zh,'接续：'+q.pattern,'说明：'+q.tip,'');q.o.forEach((o,j)=>lines.push((j+1)+'. '+clean(o[0])+' | '+o[1]+' | '+o[2]+(j===q.a?' ✓':'')));lines.push('','例句：'+clean(q.ex),'例句翻译：'+q.exzh,'易混点：'+q.mix,'','---','')});const blob=new Blob([lines.join('\n')],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='JLPT错题本.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
const qs=new URLSearchParams(location.search);
if(['N2','N3'].includes(qs.get('level')))$('level').value=qs.get('level');
if(['all','grammar','vocab','reading','writing'].includes(qs.get('type')))$('type').value=qs.get('type');
if(['unseen','all','wrong','star'].includes(qs.get('mode')))mode=qs.get('mode');
document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
const wanted=qs.get('focus');
if(wanted){const at=pool().findIndex(x=>x.id===wanted);if(at>=0)idx=at;}
render();
})();
</script>
